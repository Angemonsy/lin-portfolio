const MoodAnalyticsModal = ({ isOpen, onClose, reviews, history, isDarkMode }) => {
    if (!isOpen) return null;
    const card  = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub   = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';
    const MOODS_EMOJI = ['😞','😐','🙂','😎','🔥'];
    const MOODS_LABEL = ['低沉','平淡','还行','不错','燃爆'];
    const MOOD_COLORS = ['#ef4444','#f59e0b','#3b82f6','#8b5cf6','#10b981'];

    // 取最近30天有复盘的数据
    const dataPoints = [];
    for (let i=29; i>=0; i--) {
        const d = new Date(); d.setDate(d.getDate()-i);
        const k = dateKey(d);
        const rev = reviews[k];
        const completedCnt = Object.values(history[k]||{}).filter(Boolean).length;
        dataPoints.push({
            date: k,
            label: d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}),
            mood: rev ? rev.mood : null,
            completion: (completedCnt / PLAN_DATA.length) * 100,
        });
    }

    const withMood = dataPoints.filter(d=>d.mood!==null);
    const avgMood = withMood.length ? (withMood.reduce((s,d)=>s+d.mood,0)/withMood.length).toFixed(1) : '—';
    const moodDist = [0,1,2,3,4].map(m=>({m, cnt: withMood.filter(d=>d.mood===m).length}));
    const bestDay = [...withMood].sort((a,b)=>b.mood-a.mood)[0];

    // 计算 mood和完成率 相关性（简单计算）
    const corr = withMood.length > 3 ? (() => {
        const n=withMood.length, sx=withMood.reduce((s,d)=>s+d.mood,0), sy=withMood.reduce((s,d)=>s+d.completion,0);
        const mx=sx/n, my=sy/n;
        const num=withMood.reduce((s,d)=>s+(d.mood-mx)*(d.completion-my),0);
        const den=Math.sqrt(withMood.reduce((s,d)=>s+(d.mood-mx)**2,0)*withMood.reduce((s,d)=>s+(d.completion-my)**2,0));
        return den ? (num/den).toFixed(2) : '0';
    })() : null;

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>
                <div className={`p-4 border-b flex justify-between items-center shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-violet-100 flex items-center justify-center">
                            <i className="fas fa-brain text-violet-600 text-sm"/>
                        </div>
                        <div>
                            <h3 className={`text-base font-black ${tMain}`}>情绪分析 Mood Analytics</h3>
                            <p className={`text-[10px] ${tSub}`}>近30天 · {withMood.length} 条复盘 · 平均状态 {avgMood}/4</p>
                        </div>
                    </div>
                    <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {withMood.length < 3 ? (
                        <div className={`text-center py-16 ${tSub}`}>
                            <i className="fas fa-smile text-4xl opacity-20 mb-3 block"/>
                            <p className="text-sm">至少完成3次结构化复盘才能看到情绪分析</p>
                        </div>
                    ) : (<>
                        {/* 心情 + 完成率 折线图 */}
                        <div className={`rounded-xl p-4 border ${sub}`}>
                            <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>近30天 心情 vs 完成率</p>
                            <svg viewBox="0 0 400 100" className="w-full overflow-visible">
                                {/* 完成率线 */}
                                {(() => {
                                    const pts = dataPoints.map((d,i)=>{
                                        const x=(i/(dataPoints.length-1))*380+10;
                                        const y=90-d.completion*0.8;
                                        return `${x},${y}`;
                                    });
                                    return <polyline points={pts.join(' ')} fill="none" stroke="rgba(99,102,241,0.4)" strokeWidth="1.5" strokeDasharray="3,3"/>;
                                })()}
                                {/* 心情线 */}
                                {(() => {
                                    const moodPts = dataPoints.filter(d=>d.mood!==null).map((d,_,arr)=>{
                                        const idx=dataPoints.indexOf(d);
                                        const x=(idx/(dataPoints.length-1))*380+10;
                                        const y=90-(d.mood/4)*80;
                                        return {x,y,d};
                                    });
                                    if (moodPts.length<2) return null;
                                    const line=moodPts.map(p=>`${p.x},${p.y}`).join(' ');
                                    return (<>
                                        <polyline points={line} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                                        {moodPts.map((p,i)=>(
                                            <g key={i}>
                                                <circle cx={p.x} cy={p.y} r="4" fill={MOOD_COLORS[p.d.mood]}/>
                                                <text x={p.x} y={p.y-8} textAnchor="middle" fontSize="10">{MOODS_EMOJI[p.d.mood]}</text>
                                            </g>
                                        ))}
                                    </>);
                                })()}
                                <line x1="10" y1="50" x2="390" y2="50" stroke={isDarkMode?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.04)'} strokeWidth="1"/>
                            </svg>
                            <div className="flex items-center gap-4 mt-1">
                                <div className="flex items-center gap-1"><div className="w-4 h-0.5 bg-emerald-400 rounded"/><span className={`text-[9px] ${tSub}`}>心情趋势</span></div>
                                <div className="flex items-center gap-1"><div className="w-4 h-0.5 bg-indigo-400 rounded opacity-50" style={{borderTop:'1px dashed'}} /><span className={`text-[9px] ${tSub}`}>完成率</span></div>
                            </div>
                        </div>

                        {/* 统计卡片 */}
                        <div className="grid grid-cols-3 gap-3">
                            <div className={`rounded-xl p-3 border text-center ${sub}`}>
                                <p className="text-2xl">{MOODS_EMOJI[Math.round(Number(avgMood))]}</p>
                                <p className={`text-sm font-black ${tMain}`}>{avgMood}</p>
                                <p className={`text-[9px] ${tSub}`}>平均心情</p>
                            </div>
                            <div className={`rounded-xl p-3 border text-center ${sub}`}>
                                <p className="text-2xl">{bestDay?MOODS_EMOJI[bestDay.mood]:'—'}</p>
                                <p className={`text-[10px] font-bold ${tMain}`}>{bestDay?.date?.slice(5)||'—'}</p>
                                <p className={`text-[9px] ${tSub}`}>最佳状态日</p>
                            </div>
                            <div className={`rounded-xl p-3 border text-center ${sub}`}>
                                <p className={`text-xl font-black ${tMain}`}>{corr||'—'}</p>
                                <p className={`text-[9px] ${tSub} mt-1`}>自律↔心情相关度</p>
                                {corr && <p className={`text-[9px] font-bold mt-0.5 ${Number(corr)>0.3?'text-emerald-500':Number(corr)<-0.1?'text-red-500':tSub}`}>{Number(corr)>0.3?'强相关 🔥':Number(corr)<-0.1?'反向?':'弱相关'}</p>}
                            </div>
                        </div>

                        {/* 心情分布 */}
                        <div>
                            <p className={`text-[10px] font-black uppercase tracking-widest mb-2 ${tSub}`}>心情分布</p>
                            <div className="space-y-2">
                                {moodDist.filter(m=>m.cnt>0).reverse().map(({m,cnt}) => (
                                    <div key={m} className="flex items-center gap-2">
                                        <span className="text-base w-6">{MOODS_EMOJI[m]}</span>
                                        <span className={`text-[10px] w-12 ${tSub}`}>{MOODS_LABEL[m]}</span>
                                        <div className="flex-1 h-4 rounded-full overflow-hidden" style={{background:isDarkMode?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'}}>
                                            <div className="h-full rounded-full transition-all" style={{width:`${(cnt/withMood.length)*100}%`, background:MOOD_COLORS[m]}}/>
                                        </div>
                                        <span className="text-[10px] font-black w-6 text-right" style={{color:MOOD_COLORS[m]}}>{cnt}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </>)}
                </div>
            </div>
        </div>
    );
};

    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    const now = new Date();
    const allTags = ['全部', ...CONTACT_TAGS];
    const filtered = filterTag==='全部' ? list : list.filter(c=>c.tag===filterTag);
    const sortedList = [...filtered].sort((a,b)=>(b.importance||0)-(a.importance||0));

    const getDaysSince = (dateStr) => {
        if (!dateStr) return 999;
        return Math.floor((now-new Date(dateStr))/(1000*60*60*24));
    };
    const STARS_IMPORTANCE = ['','⭐','⭐⭐','⭐⭐⭐','👑'];

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>

                        </div>
                        <div>

                            <p className={`text-[10px] ${tSub}`}>{list.length} 位联系人 · {list.filter(c=>getDaysSince(c.last_contact)>14).length} 位待跟进</p>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={startNew} className="text-xs font-black px-3 py-2 rounded-xl bg-rose-600 text-white hover:bg-rose-500 flex items-center gap-1.5">
                            <i className="fas fa-user-plus"/> 添加
                        </button>
                        <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                    </div>
                </div>

                {/* 标签筛选 */}
                <div className={`px-4 py-2 border-b flex gap-1.5 overflow-x-auto shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    {allTags.map(t=>(
                        <button key={t} onClick={()=>setFilterTag(t)}
                            className={`px-3 py-1 rounded-lg text-[10px] font-black whitespace-nowrap transition-all ${filterTag===t?'bg-rose-600 text-white':tSub+' '+sub}`}>
                            {t}
                        </button>
                    ))}
                </div>

                {editing && (
                    <div className={`p-4 border-b shrink-0 ${isDarkMode?'border-slate-800 bg-slate-800/40':'border-slate-100 bg-rose-50/30'}`}>
                        <div className="grid grid-cols-2 gap-2 mb-2">
                            <input type="text" placeholder="姓名 *" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm font-bold outline-none ${inp}`} autoFocus />
                            <input type="text" placeholder="身份/职位" value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <select value={form.tag} onChange={e=>setForm(p=>({...p,tag:e.target.value}))} className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                {CONTACT_TAGS.map(t=><option key={t} value={t}>{t}</option>)}
                            </select>
                            <input type="text" placeholder="微信号（选填）" value={form.wechat} onChange={e=>setForm(p=>({...p,wechat:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <input type="date" value={form.last_contact} onChange={e=>setForm(p=>({...p,last_contact:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <select value={form.importance} onChange={e=>setForm(p=>({...p,importance:parseInt(e.target.value)}))} className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                <option value={1}>⭐ 一般</option>
                                <option value={2}>⭐⭐ 重要</option>
                                <option value={3}>⭐⭐⭐ 核心</option>
                                <option value={4}>👑 战略</option>
                            </select>
                            <input type="text" placeholder="下一步行动" value={form.next_action} onChange={e=>setForm(p=>({...p,next_action:e.target.value}))}
                                className={`col-span-2 border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <textarea rows={2} placeholder="备注（背景、合作方向...）" value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))}
                                className={`col-span-2 border rounded-xl px-3 py-2 text-sm outline-none resize-none ${inp}`} />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl border text-sm font-bold ${isDarkMode?'border-slate-700 text-slate-400':'border-slate-200 text-slate-500'}`}>取消</button>
                            <button onClick={saveItem} className="flex-1 py-2 rounded-xl bg-rose-600 text-white font-bold text-sm hover:bg-rose-500">保存联系人</button>
                        </div>
                    </div>
                )}

                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                    {sortedList.length === 0 && (
                        <div className={`text-center py-16 ${tSub}`}>
                            <i className="fas fa-users text-4xl opacity-20 mb-3 block"/>
                            <p className="text-sm">还没有联系人，点击「添加」开始建立你的人脉网络</p>
                        </div>
                    )}
                    {sortedList.map(c => {
                        const days = getDaysSince(c.last_contact);
                        const stale = days > 14;
                        return (
                            <div key={c.id} className={`rounded-xl border p-3 group ${sub} ${stale?'border-amber-300/40':''}`}>
                                <div className="flex items-start justify-between gap-2">
                                    <div className="flex items-center gap-3 flex-1 min-w-0">
                                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 font-black text-sm ${isDarkMode?'bg-slate-700 text-slate-200':'bg-slate-200 text-slate-700'}`}>
                                            {c.name.slice(0,1)}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className={`font-black text-sm ${tMain}`}>{c.name}</span>
                                                <span className={`text-[9px] ${tSub}`}>{c.role}</span>
                                                <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-bold ${isDarkMode?'bg-slate-700 text-slate-300':'bg-slate-100 text-slate-500'}`}>{c.tag}</span>
                                                <span className="text-xs">{STARS_IMPORTANCE[c.importance||1]}</span>
                                            </div>
                                            {c.next_action && <p className={`text-[10px] font-bold mt-0.5 ${isDarkMode?'text-indigo-400':'text-indigo-600'}`}>→ {c.next_action}</p>}
                                            {c.note && <p className={`text-[10px] ${tSub} mt-0.5 line-clamp-1`}>{c.note}</p>}
                                            <p className={`text-[9px] mt-0.5 ${stale?'text-amber-500 font-bold':tSub}`}>
                                                {stale?`⚠️ ${days}天未联系`:days===0?'今天联系过':'${days}天前'}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                                        <button onClick={()=>startEdit(c)} className={`p-1.5 rounded-lg text-xs ${tSub}`}><i className="fas fa-pencil-alt"/></button>
                                        <button onClick={()=>deleteItem(c.id)} className="p-1.5 rounded-lg text-xs text-slate-400 hover:text-red-500"><i className="fas fa-trash-alt"/></button>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
};

const HubModal = ({ isOpen, onClose, contents, moneyRecords, contacts, isDarkMode }) => {

  ]));
  const [addMode, setAddMode] = React.useState(false);
  const [newTitle, setNewTitle] = React.useState('');
  const [newUrl, setNewUrl] = React.useState('');

  if (!isOpen) return null;

  const card = isDarkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900';
  const tSub = isDarkMode ? 'text-slate-400' : 'text-slate-500';
  const sub = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200';
  const inp = isDarkMode ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-200 text-slate-900 placeholder-slate-400';

  const now30 = new Date(); now30.setDate(now30.getDate()-30);
  const income30 = (moneyRecords||[]).filter(r=>r.type==='income'&&new Date(r.date)>=now30).reduce((s,r)=>s+(+r.amount||0),0);
  const publishedCount = (contents||[]).filter(c=>c.status==='published').length;
  const contactCount = (contacts||[]).length;

  const addBookmark = () => {
    if (!newTitle.trim()||!newUrl.trim()) return;
    const u = newUrl.startsWith('http')?newUrl:'https://'+newUrl;
    const updated = [...bookmarks, {id:'bk'+Date.now(), title:newTitle.trim(), url:u, icon:'fa-link', color:'#6366f1'}];
    setBookmarks(updated); LS.set('a8_bookmarks', updated);
    setNewTitle(''); setNewUrl(''); setAddMode(false);
  };
  const delBookmark = (id) => {
    const updated = bookmarks.filter(b=>b.id!==id);
    setBookmarks(updated); LS.set('a8_bookmarks', updated);
  };

  return (
    <div className="fixed inset-0 z-[500] flex items-end md:items-center justify-center" style={{background:'rgba(0,0,0,0.8)'}} onClick={onClose}>
      <div className={`w-full max-w-lg rounded-t-3xl md:rounded-3xl border shadow-2xl overflow-hidden ${card}`} onClick={e=>e.stopPropagation()}>

          <div>
            <p className="text-[10px] font-black uppercase tracking-widest text-indigo-500">个人中转站 · Alpha Hub</p>

          </div>
          <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
        </div>
        {/* Quick Stats */}
        <div className="grid grid-cols-3 gap-3 p-4">
          {[
            {label:'近30天收入', val:'¥'+income30, icon:'fa-yen-sign', color:'#f59e0b'},
            {label:'已发内容', val:publishedCount+'条', icon:'fa-film', color:'#8b5cf6'},
            {label:'人脉联系人', val:contactCount+'位', icon:'fa-users', color:'#ec4899'},
          ].map(s=>(
            <div key={s.label} className={`rounded-2xl p-3 text-center ${sub}`}>
              <i className={`fas ${s.icon} text-lg mb-1`} style={{color:s.color}}/>
              <p className="text-base font-black">{s.val}</p>
              <p className={`text-[9px] ${tSub}`}>{s.label}</p>
            </div>
          ))}
        </div>
        {/* Bookmarks */}
        <div className="px-4 pb-2">
          <div className="flex justify-between items-center mb-3">
            <p className="text-[10px] font-black uppercase tracking-widest text-indigo-500">快捷书签</p>
            <button onClick={()=>setAddMode(v=>!v)} className="text-[10px] font-black px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 flex items-center gap-1">
              <i className="fas fa-plus"/> 添加
            </button>
          </div>
          {addMode && (
            <div className={`rounded-xl p-3 mb-3 border ${sub} space-y-2`}>
              <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="名称（如 飞书文档）"
                className={`w-full px-3 py-2 rounded-lg border text-sm ${inp}`}/>
              <input value={newUrl} onChange={e=>setNewUrl(e.target.value)} placeholder="URL（如 docs.feishu.cn）"

              <div className="flex gap-2">
                <button onClick={addBookmark} className="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-sm font-black">保存</button>
                <button onClick={()=>setAddMode(false)} className={`flex-1 py-2 rounded-xl ${sub} text-sm font-black ${tSub}`}>取消</button>
              </div>
            </div>

          <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pb-2">
            {bookmarks.map(bk=>(
              <div key={bk.id} className={`rounded-xl border ${sub} p-3 flex items-center gap-2.5 group`}>
                <a href={bk.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2.5 flex-1 min-w-0">
                  <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{background:bk.color+'20'}}>
                    <i className={`fas ${bk.icon} text-sm`} style={{color:bk.color}}/>
                  </div>
                  <span className="text-xs font-bold truncate">{bk.title}</span>
                </a>
                <button onClick={()=>delBookmark(bk.id)} className={`opacity-0 group-hover:opacity-100 transition-opacity ${tSub} hover:text-red-500 text-xs shrink-0`}>
                  <i className="fas fa-trash"/>
                </button>
              </div>
            ))}
          </div>
        </div>
        {/* System card */}
        <div className={`mx-4 mb-4 rounded-2xl p-3 border ${sub}`}>
          <p className="text-[9px] font-black uppercase tracking-widest text-indigo-400 mb-1">系统说明</p>

        </div>
      </div>
    </div>
  );
};

    const flash = () => { setSaved(true); setTimeout(() => { setSaved(false); onClose(); }, 700); };

    const TABS = [
        { id:'body',    icon:'fa-weight', label:'体重', color:'#10b981' },
        { id:'money',   icon:'fa-yen-sign', label:'收支', color:'#f59e0b' },
        { id:'idea',    icon:'fa-lightbulb', label:'选题', color:'#8b5cf6' },
        { id:'contact', icon:'fa-user-plus', label:'联系人', color:'#f43f5e' },
    ];

    const doSave = () => {
        if (tab==='body') {
            if (!bw) return;

        } else if (tab==='money') {
            if (!mAmt) return;
            const newRec = [...(moneyRecords||[]), { id:'m'+Date.now(), type:mType, category:mCat, amount:Number(mAmt), note:mNote, date:today() }];

            const newList = [...(contacts||[]), { id:'ct'+Date.now(), name:cName.trim(), tag:cTag, company:'', position:'', last_contact:today(), note:'', importance:2, link:'' }];

                    <button onClick={onClose} className={`p-1.5 rounded-lg ${tSub} hover:text-red-500 text-xs`}><i className="fas fa-times"/></button>
                </div>
                {/* Tabs */}

                    {TABS.map(t=>(
                        <button key={t.id} onClick={()=>setTab(t.id)}

                            <i className={`fas ${t.icon} text-sm`} style={tab===t.id?{}:{color:t.color}}/>

                <div className="px-5 pb-5 space-y-3">
                    {tab==='body' && (<>
                        <input type="number" step="0.1" placeholder="今日体重 (kg)" value={bw} onChange={e=>setBw(e.target.value)}

                        <input placeholder="备注（可选）" value={bNote} onChange={e=>setBNote(e.target.value)}

                    {tab==='money' && (<>
                        <div className="flex gap-2">
                            <button onClick={()=>{setMType('income');setMCat('商单');}} className={`flex-1 py-2 rounded-xl text-sm font-black border transition-all ${mType==='income'?'bg-emerald-600 text-white border-emerald-600':''+tSub+' '+sub}`}>+ 收入</button>
                            <button onClick={()=>{setMType('expense');setMCat('工具订阅');}} className={`flex-1 py-2 rounded-xl text-sm font-black border transition-all ${mType==='expense'?'bg-red-600 text-white border-red-600':''+tSub+' '+sub}`}>- 支出</button>
                        </div>
                        <input type="number" placeholder="金额 (¥)" value={mAmt} onChange={e=>setMAmt(e.target.value)}
                            className={`w-full px-4 py-3 rounded-xl border text-sm font-bold ${inp}`}/>
                        <input placeholder="分类（如：商单/工具订阅）" value={mCat} onChange={e=>setMCat(e.target.value)}
                            className={`w-full px-4 py-3 rounded-xl border text-sm ${inp}`}/>

                            className={`w-full px-4 py-3 rounded-xl border text-sm font-bold ${inp}`}/>

                    {tab==='contact' && (<>
                        <input placeholder="联系人姓名 *" value={cName} onChange={e=>setCName(e.target.value)}
                            className={`w-full px-4 py-3 rounded-xl border text-sm font-bold ${inp}`}/>
                        <select value={cTag} onChange={e=>setCTag(e.target.value)}

                        </select>
                        <p className={`text-[10px] ${tSub}`}>📅 今日日期自动记录为首次接触时间</p>

                    <button onClick={doSave} className={`w-full py-3 rounded-xl font-black text-sm transition-all ${saved?'bg-emerald-600 text-white':'bg-indigo-600 text-white hover:bg-indigo-500'}`}>
                        {saved ? '✅ 已保存！' : '⚡ 立刻保存'}
                    </button>
                </div>
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   H  GlobalSearch — ⌘K 全局搜索
───────────────────────────────────────── */
const GlobalSearch = ({ isOpen, onClose, contents, schools, contacts, reviews, moneyRecords, weeks,
    bodyLogs, timelineNodes, countdowns,
    onOpenContent, onOpenSchools, onOpenNetwork, onOpenMoney, onOpenWeekly,
    onOpenBody, onOpenMood, onOpenReport, onOpenTimeline, onOpenAnalytics,
    onOpenMultiCD, onOpenProjects, onOpenAcademic, onOpenKPI, onOpenHub,
    onOpenLevelMap, onOpenFocus, onOpenData,
    isDarkMode }) => {
    const [q, setQ] = React.useState('');
    const inputRef = React.useRef(null);

    React.useEffect(() => {
        if (isOpen) { setQ(''); setTimeout(() => inputRef.current?.focus(), 80); }
    }, [isOpen]);

    if (!isOpen) return null;

    const card = isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-900';
    const sub  = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200';
    const tSub = isDarkMode ? 'text-slate-400' : 'text-slate-500';
    const hl   = isDarkMode ? 'bg-slate-800' : 'bg-indigo-50';

    const term = q.trim().toLowerCase();
    const results = [];

    // 所有模块的关键词映射，用于「输入模块名直接跳转」
    const MODULE_KEYWORDS = [
        { keys:['内容','流水线','content','pipeline','发布','视频','选题','灵感'], icon:'fa-film',           color:'#8b5cf6', label:'内容流水线',   action:()=>{onOpenContent();onClose();} },
        { keys:['院校','保研','学校','专业','导师','套磁','申请'],                   icon:'fa-university',    color:'#3b82f6', label:'目标院校管理', action:()=>{onOpenSchools();onClose();} },
        { keys:['人脉','联系人','network','contact','朋友','大厂','跟进'],           icon:'fa-network-wired', color:'#f43f5e', label:'人脉图谱',     action:()=>{onOpenNetwork();onClose();} },
        { keys:['现金','收入','支出','money','财务','商单','收支'],                   icon:'fa-coins',         color:'#10b981', label:'现金流',       action:()=>{onOpenMoney();onClose();} },
        { keys:['周','作战','week','计划','目标','复盘周'],                           icon:'fa-chess',         color:'#6366f1', label:'周作战室',     action:()=>{onOpenWeekly();onClose();} },
        { keys:['体能','体重','健身','训练','body','gym','撸铁'],                     icon:'fa-dumbbell',      color:'#10b981', label:'体能追踪',     action:()=>{onOpenBody();onClose();} },
        { keys:['情绪','心情','mood','状态','趋势','分析心情'],                       icon:'fa-brain',         color:'#a855f7', label:'情绪分析',     action:()=>{onOpenMood();onClose();} },
        { keys:['月报','战报','report','月度','成就','总结'],                         icon:'fa-trophy',        color:'#f59e0b', label:'月度战报',     action:()=>{onOpenReport();onClose();} },
        { keys:['时间线','timeline','保研流程','节点','面试','入学'],                 icon:'fa-route',         color:'#6366f1', label:'保研时间线',   action:()=>{onOpenTimeline();onClose();} },
        { keys:['内容分析','数据','播放','涨粉','analytics','表现'],                  icon:'fa-chart-line',    color:'#a855f7', label:'内容数据分析', action:()=>{onOpenAnalytics();onClose();} },
        { keys:['倒计时','countdown','截止','考试','六级','deadline'],               icon:'fa-clock',         color:'#3b82f6', label:'多倒计时',     action:()=>{onOpenMultiCD();onClose();} },
        { keys:['项目','project','商业','副业','攀哥','奇绩'],                        icon:'fa-project-diagram',color:'#f59e0b',label:'商业项目',     action:()=>{onOpenProjects();onClose();} },
        { keys:['学业','kpi','成绩','六级','英语','论文','课程'],                     icon:'fa-graduation-cap',color:'#3b82f6', label:'学业KPI',      action:()=>{onOpenAcademic();onClose();} },
        { keys:['hub','中转','书签','链接','工具','跳转'],                            icon:'fa-th',            color:'#6366f1', label:'个人中转站',   action:()=>{onOpenHub();onClose();} },
        { keys:['等级','level','成长','里程碑','进化','xp'],                         icon:'fa-map',           color:'#f59e0b', label:'成长里程碑',   action:()=>{onOpenLevelMap();onClose();} },
        { keys:['专注','番茄','focus','pomodoro','计时','timer'],                     icon:'fa-crosshairs',    color:'#ef4444', label:'专注模式',     action:()=>{onOpenFocus();onClose();} },
        { keys:['数据','备份','导出','导入','重置','data'],                           icon:'fa-database',      color:'#64748b', label:'数据备份',     action:()=>{onOpenData();onClose();} },
    ];

    if (term.length >= 1) {
        // 先做模块名称关键词匹配（最高优先级）
        MODULE_KEYWORDS.filter(m => m.keys.some(k => k.includes(term) || term.includes(k))).slice(0,3).forEach(m => {
            results.push({ icon:m.icon, color:m.color, label:m.label, sub:'打开模块', action:m.action });
        });
        // 再做数据内容全文匹配
        (contents||[]).filter(c=>c.title?.toLowerCase().includes(term)||c.note?.toLowerCase().includes(term)).slice(0,3).forEach(c=>{
            results.push({ type:'content', icon:'fa-film', color:'#8b5cf6', label:c.title, sub:'内容 · '+c.status, action:()=>{onOpenContent();onClose();} });
        });
        (schools||[]).filter(s=>s.name?.toLowerCase().includes(term)||s.major?.toLowerCase().includes(term)).slice(0,2).forEach(s=>{
            results.push({ type:'school', icon:'fa-university', color:'#3b82f6', label:s.name, sub:s.rank+' · '+s.major, action:()=>{onOpenSchools();onClose();} });
        });
        (contacts||[]).filter(c=>c.name?.toLowerCase().includes(term)||c.tag?.toLowerCase().includes(term)||c.company?.toLowerCase().includes(term)).slice(0,2).forEach(c=>{
            results.push({ type:'contact', icon:'fa-user', color:'#f43f5e', label:c.name, sub:(c.tag||'')+(c.company?' · '+c.company:''), action:()=>{onOpenNetwork();onClose();} });
        });
        (moneyRecords||[]).filter(r=>r.note?.toLowerCase().includes(term)||r.category?.toLowerCase().includes(term)).slice(0,2).forEach(r=>{
            results.push({ type:'money', icon:'fa-yen-sign', color:'#10b981', label:`${r.type==='income'?'+':'-'}¥${r.amount} ${r.category}`, sub:r.date+(r.note?' · '+r.note:''), action:()=>{onOpenMoney();onClose();} });
        });
        (bodyLogs||[]).filter(b=>b.note?.toLowerCase().includes(term)).slice(0,2).forEach(b=>{
            results.push({ icon:'fa-dumbbell', color:'#10b981', label:`体能 ${b.date} ${b.weight?b.weight+'kg':''}`, sub:b.note||'', action:()=>{onOpenBody();onClose();} });
        });
        Object.entries(weeks||{}).filter(([k,w])=>((w.goal1||'')+(w.goal2||'')+(w.goal3||'')+(w.review||'')).toLowerCase().includes(term)).slice(0,2).forEach(([k,w])=>{
            results.push({ type:'week', icon:'fa-chess', color:'#6366f1', label:`周计划 ${k}`, sub:(w.goal1||'').slice(0,30), action:()=>{onOpenWeekly();onClose();} });
        });
        (timelineNodes||[]).filter(n=>n.title?.toLowerCase().includes(term)||n.note?.toLowerCase().includes(term)).slice(0,2).forEach(n=>{
            results.push({ icon:'fa-route', color:'#6366f1', label:n.title, sub:'保研时间线节点', action:()=>{onOpenTimeline();onClose();} });
        });
        (countdowns||[]).filter(c=>c.label?.toLowerCase().includes(term)).slice(0,2).forEach(c=>{
            results.push({ icon:'fa-clock', color:'#3b82f6', label:c.label, sub:'倒计时', action:()=>{onOpenMultiCD();onClose();} });
        });
    }

    const shortcuts = MODULE_KEYWORDS;

    return (
        <div className="fixed inset-0 z-[600] flex items-start justify-center pt-[10vh] px-4" style={{background:'rgba(0,0,0,0.7)'}} onClick={onClose}>
            <div className={`w-full max-w-lg rounded-2xl border shadow-2xl overflow-hidden ${card}`} onClick={e=>e.stopPropagation()}>
                {/* Search input */}
                <div className={`flex items-center gap-3 p-4 border-b ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <i className="fas fa-search text-indigo-500"/>
                    <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)}
                        placeholder="搜索内容、院校、联系人、收支记录…"
                        className={`flex-1 bg-transparent text-sm font-medium outline-none ${isDarkMode?'text-white placeholder-slate-500':'text-slate-900 placeholder-slate-400'}`}/>
                    <kbd className={`text-[9px] font-black px-1.5 py-0.5 rounded ${sub} ${tSub}`}>ESC</kbd>
                </div>
                {/* Results */}
                <div className="max-h-80 overflow-y-auto">
                    {term && results.length > 0 ? (
                        <div className="p-2">
                            {results.map((r,i)=>(
                                <button key={i} onClick={r.action} className={`w-full flex items-center gap-3 p-3 rounded-xl mb-1 text-left transition-all hover:${hl}`}>
                                    <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{background:r.color+'20'}}>
                                        <i className={`fas ${r.icon} text-xs`} style={{color:r.color}}/>
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-sm font-bold truncate">{r.label}</p>
                                        <p className={`text-[9px] truncate ${tSub}`}>{r.sub}</p>
                                    </div>
                                    <i className="fas fa-arrow-right text-xs opacity-30"/>
                                </button>
                            ))}
                        </div>
                    ) : term && results.length === 0 ? (
                        <div className={`text-center py-10 ${tSub}`}>
                            <i className="fas fa-search text-3xl opacity-20 mb-2 block"/>
                            <p className="text-sm">没有找到「{q}」相关内容</p>
                        </div>
                    ) : (
                        <div className="p-3">
                            <p className={`text-[9px] font-black uppercase tracking-widest mb-2 px-1 ${tSub}`}>快速跳转</p>
                            {shortcuts.map((s,i)=>(
                                <button key={i} onClick={s.action} className={`w-full flex items-center gap-3 p-3 rounded-xl mb-1 text-left transition-all hover:${hl}`}>
                                    <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{background:s.color+'20'}}>
                                        <i className={`fas ${s.icon} text-xs`} style={{color:s.color}}/>
                                    </div>
                                    <p className="text-sm font-bold">{s.label}</p>
                                    <i className="fas fa-arrow-right text-xs opacity-20 ml-auto"/>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
                <div className={`px-4 py-2 border-t text-[9px] flex gap-3 ${tSub} ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <span><kbd className={`px-1 py-0.5 rounded text-[8px] font-black ${sub}`}>↑↓</kbd> 导航</span>
                    <span><kbd className={`px-1 py-0.5 rounded text-[8px] font-black ${sub}`}>↵</kbd> 打开</span>
                    <span><kbd className={`px-1 py-0.5 rounded text-[8px] font-black ${sub}`}>ESC</kbd> 关闭</span>
                    <span className="ml-auto opacity-60">⌘K 唤出</span>
                </div>
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   N1  今日智能提醒横幅 Smart Time Banner
───────────────────────────────────────── */
const SmartTimeBanner = ({ isDarkMode }) => {
    const [now, setNow] = useState(new Date());
    useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 30000);
        return () => clearInterval(t);
    }, []);

    const h = now.getHours(), m = now.getMinutes();
    const totalMins = h * 60 + m;

    // 任务时间段映射
    const schedule = [
        { id:'deep_input',   start:8*60+30,  end:9*60+30,  label:'🧠 优质信息输入/学习', color:'#3b82f6', urgency:'now' },
        { id:'study_push',   start:10*60,    end:11*60+30, label:'🎓 推进学业内容',      color:'#6366f1', urgency:'now' },
        { id:'sales',        start:14*60,    end:15*60+30, label:'🤝 销售/成交推进',     color:'#f59e0b', urgency:'now' },
        { id:'biz_push',     start:15*60+30, end:17*60,    label:'⚡ 推进商业内容',      color:'#f59e0b', urgency:'now' },
        { id:'gym',          start:17*60,    end:20*60,    label:'💪 健身/撸铁/有氧',    color:'#10b981', urgency:'now' },
        { id:'short_video',  start:20*60,    end:21*60,    label:'🎬 短视频拍摄/发布',  color:'#f59e0b', urgency:'now' },
        { id:'approach',     start:21*60,    end:22*60,    label:'🗣️ 搭讪/社交实战',     color:'#f43f5e', urgency:'now' },
        { id:'daily_review', start:23*60,    end:23*60+20, label:'📖 每日结构化复盘',    color:'#8b5cf6', urgency:'now' },
    ];

    const current = schedule.find(s => totalMins >= s.start && totalMins < s.end);
    const upcoming = !current ? schedule.find(s => s.start > totalMins) : null;

    // 找过期未完成（今天已过时间）
    const missed = schedule.filter(s => totalMins > s.end);

    if (!current && !upcoming) {
        return (
            <div className={`rounded-2xl p-3 mb-4 flex items-center gap-3 border ${isDarkMode ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <span className="text-lg">🌙</span>
                <div>
                    <p className={`text-xs font-black ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>今日任务时段已结束</p>
                    <p className="text-[10px] text-slate-400">完成复盘，明天继续战斗</p>
                </div>
            </div>
        );
    }

    if (current) {
        return (
            <div className="rounded-2xl p-3 mb-4 flex items-center gap-3 border animate-pulse"
                style={{ background: current.color + '15', borderColor: current.color + '50' }}>
                <div className="w-2 h-2 rounded-full shrink-0" style={{ background: current.color, boxShadow: `0 0 8px ${current.color}` }} />
                <div className="flex-1 min-w-0">
                    <p className="text-[10px] font-black uppercase tracking-widest text-red-500">🔴 NOW — 当前战场</p>
                    <p className="text-sm font-black" style={{ color: current.color }}>{current.label}</p>
                </div>
                <div className="text-right shrink-0">
                    <p className="text-[9px] font-mono text-slate-400">{String(Math.floor(current.end/60)).padStart(2,'0')}:{String(current.end%60).padStart(2,'0')} 结束</p>
                    <p className="text-[9px] font-black" style={{ color: current.color }}>还剩 {current.end - totalMins} 分钟</p>
                </div>
            </div>
        );
    }

    return (
        <div className="rounded-2xl p-3 mb-4 flex items-center gap-3 border"
            style={{ background: upcoming.color + '10', borderColor: upcoming.color + '30' }}>
            <span className="text-base">⏰</span>
            <div className="flex-1 min-w-0">
                <p className="text-[10px] font-black uppercase tracking-widest text-amber-500">NEXT MISSION</p>
                <p className="text-sm font-black" style={{ color: upcoming.color }}>{upcoming.label}</p>
            </div>
            <div className="text-right shrink-0">
                <p className="text-[9px] font-mono text-slate-400">{String(Math.floor(upcoming.start/60)).padStart(2,'0')}:{String(upcoming.start%60).padStart(2,'0')} 开始</p>
                <p className="text-[9px] font-black text-amber-500">距开始 {upcoming.start - totalMins} 分钟</p>
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   N2  任务绑定番茄 Task-Bound Pomodoro
───────────────────────────────────────── */
const TaskPomodoroModal = ({ isOpen, onClose, task, onComplete, isDarkMode }) => {
    const FOCUS_MINS = 25;
    const [left, setLeft] = useState(FOCUS_MINS * 60);
    const [active, setActive] = useState(false);
    const [done, setDone] = useState(false);

    useEffect(() => { if (isOpen) { setLeft(FOCUS_MINS * 60); setActive(false); setDone(false); } }, [isOpen]);
    useEffect(() => {
        let t;
        if (active && left > 0) t = setInterval(() => setLeft(l => l - 1), 1000);
        else if (active && left === 0) { setActive(false); setDone(true); }
        return () => clearInterval(t);
    }, [active, left]);

    if (!isOpen || !task) return null;

    const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    const pct = ((FOCUS_MINS * 60 - left) / (FOCUS_MINS * 60)) * 100;
    const r = 88; const circ = 2 * Math.PI * r;
    const lineColor = (LINES[task.line] || {}).color || '#6366f1';

    return (
        <div className="fixed inset-0 z-[600] bg-black/90 flex flex-col items-center justify-center" onClick={onClose}>
            <div className="flex flex-col items-center gap-6" onClick={e => e.stopPropagation()}>
                {done ? (
                    <>
                        <div className="text-6xl animate-bounce">🔥</div>
                        <h2 className="text-white font-black text-2xl tracking-tighter">任务完成！+{task.xp * 2} XP</h2>
                        <p className="text-slate-400 text-sm">专注奖励：XP 双倍加成</p>
                        <div className="flex gap-3">
                            <button onClick={() => { onComplete(task.id); onClose(); }}
                                className="px-8 py-3 rounded-full bg-emerald-600 text-white font-black text-sm hover:bg-emerald-500 shadow-lg shadow-emerald-500/30">
                                ✅ 打卡完成
                            </button>
                            <button onClick={onClose} className="px-6 py-3 border border-slate-700 text-slate-400 rounded-full font-bold text-sm hover:text-white">
                                稍后打卡
                            </button>
                        </div>
                    </>
                ) : (
                    <>
                        <div className="text-center">
                            <p className="text-[10px] font-black uppercase tracking-widest mb-1" style={{ color: lineColor }}>
                                {(LINES[task.line] || {}).label || '专注模式'}
                            </p>
                            <h2 className="text-white font-black text-xl">{task.title}</h2>
                            <p className="text-slate-500 text-xs mt-1">{task.time} · +{task.xp} XP（专注完成额外×2）</p>
                        </div>
                        <div className="relative w-56 h-56 flex items-center justify-center">
                            <svg width="224" height="224" className="absolute">
                                <circle cx="112" cy="112" r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="12" />
                                <circle cx="112" cy="112" r={r} fill="none" stroke={lineColor} strokeWidth="12"
                                    strokeLinecap="round"
                                    strokeDasharray={`${circ * pct / 100} ${circ}`}
                                    style={{ transform: 'rotate(-90deg)', transformOrigin: 'center', transition: 'stroke-dasharray 0.5s' }} />
                            </svg>
                            <div className={`text-[4.5rem] font-black text-slate-100 leading-none tracking-tighter tabular-nums select-none ${active ? 'focus-pulse' : ''}`}>
                                {fmt(left)}
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setActive(!active)}
                                className={`px-8 py-3 rounded-full font-black uppercase tracking-widest text-sm ${active ? 'border border-slate-700 text-slate-500 hover:text-white' : 'text-white shadow-lg'}`}
                                style={!active ? { background: lineColor, boxShadow: `0 8px 30px ${lineColor}50` } : {}}>
                                {active ? '暂停' : '开始专注'}
                            </button>
                            <button onClick={() => { setLeft(FOCUS_MINS * 60); setActive(false); }}
                                className="px-6 py-3 border border-slate-700 text-slate-500 hover:text-white rounded-full font-black uppercase tracking-widest text-sm">
                                重置
                            </button>
                        </div>
                        <button onClick={onClose} className="text-slate-700 hover:text-slate-400 text-xs font-bold uppercase tracking-widest">Exit</button>
                    </>
                )}
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   N3  月度战报 Monthly Report Modal
───────────────────────────────────────── */
const MonthlyReportModal = ({ isOpen, onClose, history, reviews, moneyRecords, kpi, isDarkMode }) => {
    const [selMonth, setSelMonth] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    });

    if (!isOpen) return null;

    const [year, month] = selMonth.split('-').map(Number);
    const daysInMonth = new Date(year, month, 0).getDate();

    // 统计该月数据
    const monthDays = [];
    for (let d = 1; d <= daysInMonth; d++) {
        const dateObj = new Date(year, month - 1, d);
        const k = dateKey(dateObj);
        monthDays.push({ d, k, hist: history[k] || {}, rev: reviews[k] || null });
    }

    const activeDays = monthDays.filter(d => Object.values(d.hist).some(Boolean)).length;
    const totalTaskDone = monthDays.reduce((s, d) => s + Object.values(d.hist).filter(Boolean).length, 0);
    const totalPossible = daysInMonth * PLAN_DATA.length;
    const completionRate = Math.round((totalTaskDone / totalPossible) * 100);

    // 最长连击
    let maxStreak = 0, curStreak = 0;
    monthDays.forEach(d => {
        if (Object.values(d.hist).some(Boolean)) { curStreak++; maxStreak = Math.max(maxStreak, curStreak); }
        else curStreak = 0;
    });

    // 月度复盘情绪平均
    const moodData = monthDays.filter(d => d.rev && d.rev.mood !== undefined);
    const avgMood = moodData.length ? (moodData.reduce((s,d) => s + d.rev.mood, 0) / moodData.length).toFixed(1) : '—';
    const MOODS_EMOJI = ['😞','😐','🙂','😎','🔥'];

    // 月收入
    const monthIncome = moneyRecords
        .filter(r => r.type === 'income' && r.date && r.date.startsWith(selMonth))
        .reduce((s,r) => s + Number(r.amount||0), 0);
    const monthExpense = moneyRecords
        .filter(r => r.type === 'expense' && r.date && r.date.startsWith(selMonth))
        .reduce((s,r) => s + Number(r.amount||0), 0);

    // 生成动态月份列表：往前12月+往后6月（持续可用）
    const months = [];
    for (let i = -6; i <= 12; i++) {
        const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
        months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }

    const card = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub  = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    // 热力图颜色
    const heatColor = (cnt) => {
        if (cnt === 0) return isDarkMode ? '#1e293b' : '#f1f5f9';
        if (cnt < 3) return '#93c5fd';
        if (cnt < 5) return '#6366f1';
        return '#4f46e5';
    };

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>
                {/* Header */}
                <div className={`p-4 border-b flex justify-between items-center shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-amber-100 flex items-center justify-center">
                            <i className="fas fa-trophy text-amber-600 text-sm"/>
                        </div>
                        <div>
                            <h3 className={`text-base font-black ${tMain}`}>月度战报 Monthly Report</h3>
                            <p className={`text-[10px] ${tSub}`}>{selMonth} 自律成就单</p>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                    </div>
                </div>

                {/* 月份切换 — 动态生成，往前12月+往后6月，持续可用 */}
                <div className={`px-4 py-2 border-b flex gap-1.5 overflow-x-auto shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    {months.map(m => {
                        const isCurrent = m === `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
                        const isFuture = m > `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
                        return (
                            <button key={m} onClick={()=>setSelMonth(m)}
                                className={`px-3 py-1 rounded-lg text-[10px] font-black whitespace-nowrap transition-all ${selMonth===m?'bg-amber-500 text-white':tSub+' '+sub}`}>
                                {isCurrent ? '📍' : isFuture ? '🔮' : ''}{m}
                            </button>
                        );
                    })}
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4" id="monthly-report-content">
                    {/* 核心指标 */}
                    <div className="grid grid-cols-2 gap-3">
                        {[
                            { label:'打卡天数', value: activeDays, sub:`/ ${daysInMonth} 天`, color:'#6366f1' },
                            { label:'综合完成率', value: completionRate+'%', sub:`${totalTaskDone} 项完成`, color:'#10b981' },
                            { label:'最高连击', value: maxStreak+'天', sub:'连续打卡记录', color:'#f59e0b' },
                            { label:'平均心情', value: avgMood === '—' ? '—' : MOODS_EMOJI[Math.round(Number(avgMood))]+' '+avgMood, sub:`${moodData.length} 次复盘`, color:'#8b5cf6' },
                        ].map((stat, i) => (
                            <div key={i} className={`rounded-xl p-4 border text-center ${sub}`}>
                                <p className="text-2xl font-black" style={{ color: stat.color }}>{stat.value}</p>
                                <p className={`text-xs font-bold mt-1 ${tMain}`}>{stat.label}</p>
                                <p className={`text-[9px] ${tSub} mt-0.5`}>{stat.sub}</p>
                            </div>
                        ))}
                    </div>

                    {/* 财务摘要 */}
                    <div className={`rounded-xl p-4 border ${sub}`}>
                        <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>💰 财务摘要</p>
                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div><p className="text-lg font-black text-emerald-500">¥{monthIncome.toLocaleString()}</p><p className={`text-[9px] ${tSub}`}>收入</p></div>
                            <div><p className="text-lg font-black text-red-500">¥{monthExpense.toLocaleString()}</p><p className={`text-[9px] ${tSub}`}>支出</p></div>
                            <div><p className={`text-lg font-black ${monthIncome-monthExpense>=0?'text-emerald-500':'text-red-500'}`}>¥{(monthIncome-monthExpense).toLocaleString()}</p><p className={`text-[9px] ${tSub}`}>净收</p></div>
                        </div>
                    </div>

                    {/* 月度热力图 */}
                    <div className={`rounded-xl p-4 border ${sub}`}>
                        <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>📅 月度打卡热力图</p>
                        <div className="grid grid-cols-7 gap-1">
                            {['日','一','二','三','四','五','六'].map(d=><div key={d} className={`text-center text-[8px] ${tSub}`}>{d}</div>)}
                            {[...Array(new Date(year, month-1, 1).getDay())].map((_,i)=><div key={`e${i}`}/>)}
                            {monthDays.map(({d, hist}) => {
                                const cnt = Object.values(hist).filter(Boolean).length;
                                return (
                                    <div key={d} className="aspect-square rounded-sm flex items-center justify-center text-[8px] font-bold transition-all"
                                        style={{ background: heatColor(cnt), color: cnt > 2 ? '#fff' : isDarkMode ? '#64748b' : '#94a3b8' }}>
                                        {d}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="flex items-center gap-2 mt-2 justify-end">
                            {[0,2,4,6,8].map(c=>(<div key={c} className="flex items-center gap-1">
                                <div className="w-3 h-3 rounded-sm" style={{background: heatColor(c)}}/>
                                <span className={`text-[8px] ${tSub}`}>{c===0?'0':c<3?'1-2':c<5?'3-4':c<7?'5-6':'7+'}</span>
                            </div>))}
                        </div>
                    </div>

                    {/* 主线完成率柱状 */}
                    <div className={`rounded-xl p-4 border ${sub}`}>
                        <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>📊 各主线完成率</p>
                        {Object.entries(LINES).map(([key, line]) => {
                            const tasks = PLAN_DATA.filter(t => t.line === key);
                            let done = 0, total = tasks.length * activeDays || 1;
                            tasks.forEach(t => monthDays.forEach(d => { if (d.hist[t.id]) done++; }));
                            const pct = Math.round((done / total) * 100);
                            return (
                                <div key={key} className="mb-2">
                                    <div className="flex justify-between mb-1">
                                        <span className="text-[10px] font-bold flex items-center gap-1" style={{color:line.color}}>
                                            <i className={`fas ${line.icon} text-[9px]`}/> {line.label}
                                        </span>
                                        <span className="text-[10px] font-mono font-black" style={{color:line.color}}>{pct}%</span>
                                    </div>
                                    <div className="w-full h-3 rounded-full overflow-hidden" style={{background:isDarkMode?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'}}>
                                        <div className="h-full rounded-full" style={{width:`${pct}%`,background:line.color,transition:'width 0.7s'}}/>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* 打印/截图按钮 */}
                    <button onClick={() => window.print()}
                        className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-black text-sm hover:opacity-90 shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
                        <i className="fas fa-share-alt"/> 截图分享战报
                    </button>
                </div>
            </div>
        </div>
    );
};

                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="flex-1 cursor-pointer" onClick={()=>toggleDone(node.id)}>
                                                        <p className={`text-sm font-black ${node.done?(isDarkMode?'text-emerald-400':'text-emerald-600'):tMain} ${node.done?'line-through opacity-60':''}`}>{node.title}</p>
                                                        {node.date && (
                                                            <p className={`text-[10px] mt-0.5 ${daysLeft !== null && daysLeft < 14 ? 'text-amber-500 font-bold' : tSub}`}>
                                                                {node.date} {daysLeft !== null && !node.done && (daysLeft > 0 ? `(${daysLeft}天后)` : daysLeft === 0 ? '(今天!)' : `(已过${Math.abs(daysLeft)}天)`)}
                                                            </p>
                                                        )}
                                                        {node.note && <p className={`text-[10px] mt-1 leading-relaxed ${tSub}`}>{node.note}</p>}
                                                    </div>
                                                    <button onClick={()=>startEdit(node)} className={`p-1.5 rounded-lg text-xs ${tSub} hover:text-blue-500 shrink-0`}><i className="fas fa-pencil-alt"/></button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   N5  内容数据图表 Content Analytics Modal
───────────────────────────────────────── */
const ContentAnalyticsModal = ({ isOpen, onClose, contents, isDarkMode }) => {
    if (!isOpen) return null;

    const published = contents.filter(c => c.status === 'published');
    const card  = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub   = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    const totalViews = published.reduce((s,c) => s + Number(c.views||0), 0);
    const totalLikes = published.reduce((s,c) => s + Number(c.likes||0), 0);
    const totalFans  = published.reduce((s,c) => s + Number(c.fans_gain||0), 0);

    // 按平台汇总
    const byPlatform = {};
    published.forEach(c => {
        if (!byPlatform[c.platform]) byPlatform[c.platform] = { count:0, views:0, fans:0 };
        byPlatform[c.platform].count++;
        byPlatform[c.platform].views += Number(c.views||0);
        byPlatform[c.platform].fans  += Number(c.fans_gain||0);
    });

    // 涨粉趋势（按发布日期排序）
    const fansTrend = [...published]
        .filter(c => c.publish_date && c.fans_gain > 0)
        .sort((a,b) => a.publish_date > b.publish_date ? 1 : -1)
        .slice(-15);

    // 内容效率排行（播放量最高的5条）
    const topContent = [...published]
        .filter(c => c.views > 0)
        .sort((a,b) => Number(b.views) - Number(a.views))
        .slice(0, 5);

    const maxViews = topContent.length ? Number(topContent[0].views) : 1;

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>
                <div className={`p-4 border-b flex justify-between items-center shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-purple-100 flex items-center justify-center">
                            <i className="fas fa-chart-line text-purple-600 text-sm"/>
                        </div>
                        <div>
                            <h3 className={`text-base font-black ${tMain}`}>内容数据分析 Analytics</h3>
                            <p className={`text-[10px] ${tSub}`}>{published.length} 篇已发布 · {totalViews.toLocaleString()} 总播放</p>
                        </div>
                    </div>
                    <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                </div>

                {published.length === 0 ? (
                    <div className={`flex-1 flex items-center justify-center ${tSub}`}>
                        <div className="text-center py-16">
                            <i className="fas fa-chart-bar text-4xl opacity-20 mb-3 block"/>
                            <p className="text-sm">发布内容后即可看到数据分析</p>
                        </div>
                    </div>
                ) : (
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {/* 核心指标 */}
                        <div className="grid grid-cols-3 gap-3">
                            {[
                                { label:'总播放量', value: totalViews.toLocaleString(), color:'#8b5cf6', icon:'fa-eye' },
                                { label:'总点赞数', value: totalLikes.toLocaleString(), color:'#f43f5e', icon:'fa-heart' },
                                { label:'累计涨粉', value: '+'+totalFans, color:'#10b981', icon:'fa-user-plus' },
                            ].map((s,i) => (
                                <div key={i} className={`rounded-xl p-3 border text-center ${sub}`}>
                                    <i className={`fas ${s.icon} mb-1`} style={{color:s.color, fontSize:'16px'}}/>
                                    <p className="text-xl font-black" style={{color:s.color}}>{s.value}</p>
                                    <p className={`text-[9px] ${tSub}`}>{s.label}</p>
                                </div>
                            ))}
                        </div>

                        {/* 各平台对比 */}
                        {Object.keys(byPlatform).length > 0 && (
                            <div className={`rounded-xl p-4 border ${sub}`}>
                                <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>📱 平台表现对比</p>
                                <div className="space-y-3">
                                    {Object.entries(byPlatform).map(([platform, data]) => {
                                        const pl = CONTENT_PLATFORM[platform] || { label: platform, color: '#64748b' };
                                        const viewPct = totalViews ? Math.round((data.views/totalViews)*100) : 0;
                                        return (
                                            <div key={platform}>
                                                <div className="flex justify-between mb-1">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-2 h-2 rounded-full" style={{background:pl.color}}/>
                                                        <span className="text-[10px] font-bold" style={{color:pl.color}}>{pl.label}</span>
                                                        <span className={`text-[9px] ${tSub}`}>{data.count}篇</span>
                                                    </div>
                                                    <div className="flex gap-3">
                                                        <span className={`text-[9px] ${tSub}`}><i className="fas fa-eye mr-1"/>{data.views.toLocaleString()}</span>
                                                        <span className="text-[9px] text-emerald-500 font-bold">+{data.fans}粉</span>
                                                    </div>
                                                </div>
                                                <div className="w-full h-2 rounded-full overflow-hidden" style={{background:isDarkMode?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'}}>
                                                    <div className="h-full rounded-full" style={{width:`${viewPct}%`,background:pl.color}}/>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 涨粉折线 SVG */}
                        {fansTrend.length >= 2 && (
                            <div className={`rounded-xl p-4 border ${sub}`}>
                                <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>📈 涨粉趋势 (近{fansTrend.length}篇)</p>
                                <svg viewBox="0 0 380 80" className="w-full">
                                    {(() => {
                                        const vals = fansTrend.map(c=>Number(c.fans_gain));
                                        const maxV = Math.max(...vals, 1);
                                        const pts = vals.map((v,i) => {
                                            const x = (i/(vals.length-1))*360+10;
                                            const y = 70 - (v/maxV)*60;
                                            return [x,y];
                                        });
                                        return (<>
                                            <polyline points={pts.map(p=>p.join(',')).join(' ')} fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                            {pts.map(([x,y],i)=>(
                                                <g key={i}>
                                                    <circle cx={x} cy={y} r="3.5" fill="#10b981"/>
                                                    <text x={x} y={y-7} textAnchor="middle" fontSize="8" fill={isDarkMode?'#94a3b8':'#64748b'}>{vals[i]>0?'+'+vals[i]:''}</text>
                                                </g>
                                            ))}
                                        </>);
                                    })()}
                                </svg>
                            </div>
                        )}

                        {/* 播放量 TOP5 */}
                        {topContent.length > 0 && (
                            <div className={`rounded-xl p-4 border ${sub}`}>
                                <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${tSub}`}>🏆 播放量 TOP {topContent.length}</p>
                                <div className="space-y-2">
                                    {topContent.map((c, i) => (
                                        <div key={c.id} className="flex items-center gap-3">
                                            <div className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black shrink-0 ${i===0?'bg-amber-400 text-white':i===1?'bg-slate-400 text-white':i===2?'bg-orange-600 text-white':'bg-slate-200 text-slate-500'}`}>{i+1}</div>
                                            <div className="flex-1 min-w-0">
                                                <p className={`text-xs font-bold truncate ${tMain}`}>{c.title}</p>
                                                <div className="w-full h-1.5 rounded-full mt-1 overflow-hidden" style={{background:isDarkMode?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'}}>
                                                    <div className="h-full rounded-full bg-purple-500" style={{width:`${(Number(c.views)/maxViews)*100}%`}}/>
                                                </div>
                                            </div>
                                            <span className={`text-[10px] font-black shrink-0 ${tSub}`}>{Number(c.views).toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────

const DEFAULT_COUNTDOWNS = [
    { id:'cd1', title:'距离开学', date:'2026-03-16', color:'#3b82f6', icon:'fa-school' },
    { id:'cd2', title:'六级考试', date:'2026-06-14', color:'#f59e0b', icon:'fa-pen-alt' },
];

const MultiCountdownModal = ({ isOpen, onClose, countdowns, onSave, isDarkMode }) => {
    const [list, setList] = useState(countdowns);
    const [editing, setEditing] = useState(null);
    const [form, setForm] = useState({ title:'', date:'', color:'#6366f1', icon:'fa-flag' });

    useEffect(() => { if (isOpen) setList(countdowns); }, [isOpen, countdowns]);

    const ICONS = ['fa-school','fa-pen-alt','fa-graduation-cap','fa-flag','fa-trophy','fa-rocket','fa-heart','fa-bolt'];
    const COLORS = ['#3b82f6','#f59e0b','#10b981','#ef4444','#8b5cf6','#f43f5e','#06b6d4','#84cc16'];

    const saveItem = () => {
        if (!form.title || !form.date) return;
        const nl = editing === 'new'
            ? [...list, { ...form, id:'cd'+Date.now() }]
            : list.map(c => c.id === editing ? { ...form, id:c.id } : c);
        setList(nl); onSave(nl); setEditing(null);
    };

    if (!isOpen) return null;
    const card = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const inp  = isDarkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white border-slate-200 text-slate-900';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';
    const now = new Date(); now.setHours(0,0,0,0);

    return (
        <div className="fixed inset-0 z-[450] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
            <div className={`w-full max-w-md rounded-2xl shadow-2xl border flex flex-col max-h-[90vh] ${card}`} onClick={e=>e.stopPropagation()}>
                <div className={`p-5 border-b flex justify-between items-center ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <h3 className={`text-lg font-black ${tMain}`}>多目标倒计时</h3>
                    <div className="flex gap-2">
                        <button onClick={()=>{ setForm({title:'',date:'',color:'#6366f1',icon:'fa-flag'}); setEditing('new'); }}
                            className="text-xs font-black px-3 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-500 flex items-center gap-1">
                            <i className="fas fa-plus"/> 添加
                        </button>
                        <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                    </div>
                </div>

                {editing && (
                    <div className={`p-4 border-b space-y-2 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                        <input type="text" placeholder="倒计时名称" value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))}
                            className={`w-full border rounded-xl px-3 py-2 text-sm font-bold outline-none ${inp}`} autoFocus/>
                        <input type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}
                            className={`w-full border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}/>
                        <div className="flex gap-1 flex-wrap">
                            {COLORS.map(c=>(
                                <button key={c} onClick={()=>setForm(p=>({...p,color:c}))}
                                    className={`w-7 h-7 rounded-full border-2 transition-all ${form.color===c?'scale-125 border-white':'border-transparent'}`}
                                    style={{background:c}}/>
                            ))}
                        </div>
                        <div className="flex gap-1 flex-wrap">
                            {ICONS.map(ic=>(
                                <button key={ic} onClick={()=>setForm(p=>({...p,icon:ic}))}
                                    className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all border ${form.icon===ic?(isDarkMode?'bg-slate-600 border-slate-400':'bg-slate-200 border-slate-400'):(isDarkMode?'bg-slate-800 border-slate-700':'bg-slate-100 border-slate-200')}`}>
                                    <i className={`fas ${ic}`} style={{color:form.color}}/>
                                </button>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl border text-sm font-bold ${isDarkMode?'border-slate-700 text-slate-400':'border-slate-200 text-slate-500'}`}>取消</button>
                            <button onClick={saveItem} className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-500">保存</button>
                        </div>
                    </div>
                )}

                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                    {list.map(cd => {
                        const target = new Date(cd.date); target.setHours(0,0,0,0);
                        const days = Math.ceil((target - now) / (1000*60*60*24));
                        return (
                            <div key={cd.id} className={`rounded-xl p-4 flex items-center gap-4 border group`}
                                style={{ borderColor: cd.color+'40', background: cd.color+'10' }}>
                                <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{background:cd.color+'25'}}>
                                    <i className={`fas ${cd.icon||'fa-flag'}`} style={{color:cd.color}}/>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-xs font-black" style={{color:cd.color}}>{cd.title}</p>
                                    <p className={`text-[10px] ${tSub}`}>{cd.date}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-2xl font-black" style={{color:cd.color}}>{days > 0 ? days : 0}</p>
                                    <p className={`text-[9px] ${tSub}`}>{days > 0 ? '天后' : days === 0 ? '今天!' : '已过期'}</p>
                                </div>
                                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onClick={()=>{ setForm({title:cd.title,date:cd.date,color:cd.color,icon:cd.icon||'fa-flag'}); setEditing(cd.id); }}
                                        className={`p-1.5 rounded-lg text-xs ${tSub} hover:text-blue-500`}><i className="fas fa-pencil-alt"/></button>
                                    <button onClick={()=>{ const nl=list.filter(c=>c.id!==cd.id); setList(nl); onSave(nl); }}
                                        className="p-1.5 rounded-lg text-xs text-slate-400 hover:text-red-500"><i className="fas fa-trash-alt"/></button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
};
