/* ═══════════════════════════════════════════
   IndexedDB helpers (图片存储)
═══════════════════════════════════════════ */
const DB_NAME = 'AlphaDashboardDB_V8';
const STORE_NAME = 'images_store';
const initDB = () => new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = (e) => reject(e);
});
const saveToDB = async (key, value) => {
    try { const db = await initDB(); const tx = db.transaction([STORE_NAME], 'readwrite'); tx.objectStore(STORE_NAME).put(value, key); } catch(err) { console.error("DB Error", err); }
};
const getFromDB = async (key) => {
    try { const db = await initDB(); return new Promise((resolve) => { const req = db.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME).get(key); req.onsuccess = (e) => resolve(e.target.result || []); req.onerror = () => resolve([]); }); } catch(err) { return []; }
};
const compressImageFile = (file, maxSide = 1100, quality = 0.72) => new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('请选择图片文件'));
    const reader = new FileReader();
    reader.onload = () => {
        const img = new Image();
        img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('图片读取失败'));
        img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.readAsDataURL(file);
});

const LS = {

    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const AUTH_TOKEN_KEY = 'a8_auth_token';
const apiFetch = async (url, options = {}) => {
    const token = localStorage.getItem(AUTH_TOKEN_KEY);
    const res = await fetch(url, {
        ...options,
        headers: {
            'content-type': 'application/json',
            ...(token ? { authorization: `Bearer ${token}` } : {}),
            ...(options.headers || {})
        }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '服务暂时不可用');
    return data;
};
const CloudAPI = {
    login: (loginId, password) => apiFetch('/api/a8-login', { method:'POST', body: JSON.stringify({ loginId, password }) }),
    me: () => apiFetch('/api/a8-me'),
    loadSnapshot: () => apiFetch('/api/a8-snapshot'),
    saveSnapshot: (data) => apiFetch('/api/a8-snapshot', { method:'PUT', body: JSON.stringify({ data }) }),
    logout: () => apiFetch('/api/a8-logout', { method:'POST' })
};

const pad2 = (n) => String(n).padStart(2, '0');
const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => dateKey(new Date());
const parseDateKey = (raw) => {
    if (!raw) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return new Date(`${raw}T00:00:00`);
    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
};
const normalizeDateKey = (raw) => {
    const d = parseDateKey(raw);
    return d ? dateKey(d) : raw;
};
const normalizeHistory = (hist = {}) => Object.entries(hist || {}).reduce((acc, [rawKey, day]) => {
    const key = normalizeDateKey(rawKey);
    acc[key] = { ...(acc[key] || {}), ...(day || {}) };
    return acc;
}, {});
const normalizeDateMap = (obj = {}) => Object.entries(obj || {}).reduce((acc, [rawKey, value]) => {
    const key = normalizeDateKey(rawKey);
    acc[key] = value;
    return acc;
}, {});
const normalizeDateArrayMap = (obj = {}) => Object.entries(obj || {}).reduce((acc, [rawKey, list]) => {
    const key = normalizeDateKey(rawKey);
    acc[key] = [...(acc[key] || []), ...((Array.isArray(list) ? list : []))];
    return acc;
}, {});
const normalizePomodoroLog = (list = []) => (Array.isArray(list) ? list : []).map(item => ({
    ...item,
    date: normalizeDateKey(item.date || today()),
}));

const MiniCalendarMonth = ({ year, month, history, onSelectDate, selectedDateStr }) => {
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthName = new Date(year, month).toLocaleString('zh-CN', { month: 'short' });
    return (
        <div className="p-2">
            <h4 className="text-xs font-black uppercase text-slate-400 mb-2">{monthName}</h4>
            <div className="grid grid-cols-7 gap-0.5 text-[8px] text-center">
                {[...Array(firstDay)].map((_, i) => <div key={`e-${i}`} />)}
                {[...Array(daysInMonth)].map((_, i) => {
                    const d = i + 1;
                    const dStr = dateKey(new Date(year, month, d));
                    const cnt = Object.values(history[dStr] || {}).filter(Boolean).length;
                    let bg = 'bg-slate-100 text-slate-400';
                    if (cnt > 0) bg = 'bg-blue-200 text-blue-700';
                    if (cnt > 3) bg = 'bg-blue-400 text-white';
                    if (cnt > 5) bg = 'bg-indigo-600 text-white';
                    const isSel = selectedDateStr === dStr;
                    return (
                        <button key={d} onClick={() => onSelectDate(new Date(year, month, d))}
                            className={`aspect-square rounded-[2px] flex items-center justify-center transition-all hover:scale-125 ${bg} ${isSel ? 'ring-2 ring-amber-400' : ''}`}>
                            {d}
                        </button>
                    );
                })}
            </div>
        </div>
    );
};

const DataCoreModal = ({ isOpen, onClose, getAllData, onRestore, isDarkMode }) => {
    if (!isOpen) return null;
    const handleExport = () => {
        const data = { ...getAllData(), version:'v8.1', timestamp: new Date().toISOString() };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], { type:'application/json' }));
        a.download = `Alpha_Backup_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.json`;
        a.click();
    };
    const handleImport = e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { try { const d = JSON.parse(ev.target.result); if (confirm('确认导入？将覆盖全部数据！')) onRestore(d); } catch { alert('文件格式错误'); } };
        r.readAsText(f);
    };
    const card = isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200';
    return (
        <div className="fixed inset-0 z-[400] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
            <div className={`w-full max-w-md rounded-2xl p-6 shadow-2xl border ${card}`} onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-5">
                    <h3 className={`text-lg font-black ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>Data Core (数据中心)</h3>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times" /></button>
                </div>
                <div className="space-y-4">
                    <div className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                        <h4 className={`text-sm font-black mb-2 ${isDarkMode ? 'text-white' : 'text-slate-800'}`}>战略备份 Export</h4>
                        <p className="text-xs text-slate-500 mb-4">将所有记录、复盘日志和 XP 进度导出为本地文件，建议每周备份。</p>
                        <button onClick={handleExport} className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold flex items-center justify-center gap-2 hover:bg-blue-700 shadow-lg shadow-blue-500/20 text-sm">
                            <i className="fas fa-download" /> 导出战术备份
                        </button>
                    </div>
                    <div className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                        <h4 className={`text-sm font-black mb-2 ${isDarkMode ? 'text-white' : 'text-slate-800'}`}>数据恢复 Import</h4>
                        <p className="text-xs text-slate-500 mb-4">从备份文件恢复。⚠️ 警告：将完全覆盖当前记录！</p>
                        <label className="w-full py-3 rounded-xl border-2 border-dashed border-slate-300 text-slate-500 font-bold flex items-center justify-center gap-2 hover:border-blue-400 hover:text-blue-500 transition-all cursor-pointer text-sm">
                            <i className="fas fa-upload" /> 导入战术数据
                            <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                        </label>
                    </div>
                    <div className="p-5 rounded-2xl border bg-red-50 border-red-100">
                        <h4 className="text-sm font-black text-red-800 mb-2 uppercase italic">System Purge — 核协议</h4>
                        <p className="text-xs text-red-600 mb-4 opacity-80">擦除所有本地痕迹。如果你准备开启全新阶段，请启动此项。</p>

            </div>
        </div>
    );
};

const ProjectModal = ({ isOpen, onClose, projects, onSave, isDarkMode }) => {
    const [list, setList] = useState(projects);
    const [editing, setEditing] = useState(null); // null | 'new' | id
    const [form, setForm] = useState({ name:'', type:'ip', status:'active', progress:0, note:'', link:'' });

    useEffect(() => { if (isOpen) setList(projects); }, [isOpen, projects]);

    const startNew = () => {
        setForm({ name:'', type:'ip', status:'active', progress:0, note:'', link:'' });
        setEditing('new');
    };
    const startEdit = (p) => { setForm({ ...p }); setEditing(p.id); };
    const saveItem = () => {
        if (!form.name.trim()) return;
        let newList;
        if (editing === 'new') {
            newList = [...list, { ...form, id: 'p' + Date.now() }];
        } else {
            newList = list.map(p => p.id === editing ? { ...form, id: p.id } : p);
        }
        setList(newList);
        setEditing(null);
        onSave(newList);
    };
    const deleteItem = (id) => {
        const newList = list.filter(p => p.id !== id);
        setList(newList);
        onSave(newList);
    };

    if (!isOpen) return null;
    const card = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200';
    const inp = isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-500' : 'bg-white border-slate-200 text-slate-900';
    const textMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const textSub = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    const activeCount = list.filter(p => p.status === 'active').length;

    return (
        <div className="fixed inset-0 z-[450] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>

                        <h3 className={`text-lg font-black ${textMain}`}>商业项目管理台</h3>
                        <p className={`text-[10px] mt-0.5 ${textSub}`}>{activeCount} 个项目进行中 · {list.length} 个总计</p>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={startNew} className="text-xs font-black px-3 py-2 rounded-xl bg-amber-500 text-white hover:bg-amber-400 flex items-center gap-1.5 transition-all">
                            <i className="fas fa-plus" /> 新增项目

                        <button onClick={onClose} className={`p-2 rounded-lg ${isDarkMode ? 'text-slate-500 hover:text-white' : 'text-slate-400 hover:text-slate-700'}`}><i className="fas fa-times" /></button>

                </div>

                {/* 编辑表单 */}
                {editing && (
                    <div className={`p-4 border-b ${isDarkMode ? 'border-slate-800 bg-slate-800/50' : 'border-slate-100 bg-blue-50/50'}`}>
                        <p className={`text-[10px] font-black uppercase tracking-widest mb-3 ${isDarkMode ? 'text-blue-400' : 'text-blue-600'}`}>{editing === 'new' ? '✦ 新增项目' : '✎ 编辑项目'}</p>
                        <div className="grid grid-cols-2 gap-2 mb-2">
                            <div className="col-span-2">
                                <input type="text" placeholder="项目名称 *" value={form.name} onChange={e => setForm(p => ({...p, name: e.target.value}))}
                                    className={`w-full border rounded-xl px-3 py-2 text-sm font-bold outline-none ${inp}`} />
                            </div>
                            <div>
                                <select value={form.type} onChange={e => setForm(p => ({...p, type: e.target.value}))}
                                    className={`w-full border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>

                                </select>
                            </div>
                            <div>
                                <select value={form.status} onChange={e => setForm(p => ({...p, status: e.target.value}))}

                        <div className="flex gap-2">
                            <button onClick={() => setEditing(null)} className={`flex-1 py-2 rounded-xl border text-sm font-bold ${isDarkMode ? 'border-slate-700 text-slate-400 hover:text-white' : 'border-slate-200 text-slate-500 hover:bg-slate-100'}`}>取消</button>

                    </div>

                {/* 项目列表 */}
                <div className="flex-1 overflow-y-auto p-4 space-y-3">

                        </div>
                    )}
                    {list.map(proj => {
                        const st = PROJECT_STATUS[proj.status] || PROJECT_STATUS.active;
                        const tp = PROJECT_TYPE_ICON[proj.type] || PROJECT_TYPE_ICON.other;
                        return (
                            <div key={proj.id} className={`rounded-xl border p-4 ${sub} group`}>
                                <div className="flex items-start justify-between gap-2 mb-2">
                                    <div className="flex items-center gap-2 min-w-0">
                                        <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{ background: tp.color + '20' }}>
                                            <i className={`fas ${tp.icon} text-xs`} style={{ color: tp.color }} />
                                        </div>
                                        <div className="min-w-0">
                                            <p className={`font-black text-sm truncate ${textMain}`}>{proj.name}</p>
                                            <div className="flex items-center gap-1.5 mt-0.5">
                                                <div className={`w-1.5 h-1.5 rounded-full ${st.dot}`} />
                                                <span className="text-[10px] font-bold" style={{ color: st.color }}>{st.label}</span>
                                                <span className={`text-[10px] ${textSub}`}>· {tp.label}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-1.5 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                        {proj.link && (
                                            <a href={proj.link} target="_blank" rel="noopener noreferrer"
                                                className="p-1.5 rounded-lg text-blue-500 hover:bg-blue-100 text-xs transition-all" title="打开项目链接">
                                                <i className="fas fa-external-link-alt" />
                                            </a>
                                        )}
                                        <button onClick={() => startEdit(proj)} className={`p-1.5 rounded-lg text-xs transition-all ${isDarkMode ? 'text-slate-400 hover:text-white hover:bg-slate-700' : 'text-slate-400 hover:text-slate-700 hover:bg-slate-200'}`}>
                                            <i className="fas fa-pencil-alt" />
                                        </button>
                                        <button onClick={() => deleteItem(proj.id)} className="p-1.5 rounded-lg text-xs text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all">
                                            <i className="fas fa-trash-alt" />
                                        </button>
                                    </div>
                                </div>
                                {/* 进度条 */}
                                <div className="mb-2">
                                    <div className="flex justify-between mb-1">
                                        <span className={`text-[9px] ${textSub}`}>推进进度</span>
                                        <span className="text-[9px] font-black" style={{ color: proj.progress >= 70 ? '#10b981' : proj.progress >= 40 ? '#f59e0b' : '#94a3b8' }}>{proj.progress}%</span>
                                    </div>
                                    <MiniBar pct={proj.progress} color={tp.color} h={5} />
                                </div>
                                {proj.note && <p className={`text-[11px] leading-relaxed ${textSub} border-t pt-2 ${isDarkMode ? 'border-slate-700' : 'border-slate-200'}`}>{proj.note}</p>}
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
};

                                {statusKeys.map(s=><option key={s} value={s}>{CONTENT_STATUS[s].label}</option>)}
                            </select>
                            <input type="text" placeholder="发布链接 (选填)" value={form.link} onChange={e=>setForm(p=>({...p,link:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <input type="date" value={form.publish_date} onChange={e=>setForm(p=>({...p,publish_date:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            {form.status === 'published' && (<>
                                <input type="number" placeholder="播放量" value={form.views||''} onChange={e=>setForm(p=>({...p,views:parseInt(e.target.value)||0}))}
                                    className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                                <input type="number" placeholder="点赞数" value={form.likes||''} onChange={e=>setForm(p=>({...p,likes:parseInt(e.target.value)||0}))}
                                    className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                                <input type="number" placeholder="涨粉数" value={form.fans_gain||''} onChange={e=>setForm(p=>({...p,fans_gain:parseInt(e.target.value)||0}))}
                                    className={`col-span-2 border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            </>)}
                            <textarea rows={2} placeholder="备注/创作思路..." value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))}
                                className={`col-span-2 border rounded-xl px-3 py-2 text-sm outline-none resize-none ${inp}`} />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl border text-sm font-bold ${isDarkMode?'border-slate-700 text-slate-400':'border-slate-200 text-slate-500'}`}>取消</button>
                            <button onClick={saveItem} className="flex-1 py-2 rounded-xl bg-purple-600 text-white font-bold text-sm hover:bg-purple-500">保存内容</button>
                        </div>
                    </div>
                )}

                {/* 💡 灵感仓库 Idea Bank */}
                {viewMode==='ideas' && (
                    <div className="flex-1 overflow-y-auto p-4">
                        <div className="flex items-center justify-between mb-4">
                            <p className="text-xs font-black text-amber-500 uppercase tracking-widest">💡 选题灵感仓库 Idea Bank</p>
                            <button onClick={()=>{startNew();setViewMode('list');}} className="text-xs font-black px-3 py-1.5 rounded-xl bg-amber-500 text-white hover:bg-amber-400 flex items-center gap-1">
                                <i className="fas fa-plus"/> 新选题
                            </button>
                        </div>
                        {list.filter(c=>c.status==='idea').length === 0 ? (
                            <div className={`text-center py-16 ${tSub}`}>
                                <i className="fas fa-lightbulb text-4xl opacity-20 mb-3 block"/>
                                <p className="text-sm">灵感仓库是空的，快去记录第一个选题！</p>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {list.filter(c=>c.status==='idea').map(c=>(
                                    <div key={c.id} className={`rounded-xl border p-3 ${sub}`}>
                                        <div className="flex items-start justify-between gap-2">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 mb-1 flex-wrap">
                                                    <span className="text-[9px] font-bold px-2 py-0.5 rounded-full"
                                                        style={{background:(CONTENT_PLATFORM[c.platform]?.color||'#6366f1')+'20',color:CONTENT_PLATFORM[c.platform]?.color||'#6366f1'}}>
                                                        {CONTENT_PLATFORM[c.platform]?.label||c.platform}
                                                    </span>
                                                    <span className={`text-[8px] ${tSub}`}>{c.created_at}</span>
                                                </div>
                                                <p className={`text-sm font-bold ${tMain}`}>{c.title}</p>
                                                {c.note && <p className={`text-[10px] mt-1 ${tSub}`}>{c.note}</p>}
                                            </div>
                                            <div className="flex flex-col gap-1 shrink-0">
                                                <button onClick={()=>{const nl=list.map(x=>x.id===c.id?{...x,status:'scripting'}:x);setList(nl);onSave(nl);}}
                                                    className="text-[9px] font-black px-2 py-1 rounded-lg bg-indigo-600 text-white whitespace-nowrap">▶ 开始撰稿</button>
                                                <button onClick={()=>deleteItem(c.id)}
                                                    className="text-[9px] px-2 py-1 rounded-lg text-red-400 hover:bg-red-50 whitespace-nowrap text-center"><i className="fas fa-trash-alt"/></button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}

                {/* 📅 内容日历视图 */}
                {viewMode==='calendar' && (
                    <div className="flex-1 overflow-y-auto p-4">
                        <div className="flex items-center justify-between mb-3">
                            <button onClick={()=>{ let m=calMonth-1,y=calYear; if(m<0){m=11;y--;} setCalMonth(m);setCalYear(y); }}
                                className={`p-2 rounded-lg ${tSub} hover:text-purple-500`}><i className="fas fa-chevron-left"/></button>
                            <span className="text-sm font-black">{calYear}年 {calMonth+1}月</span>
                            <button onClick={()=>{ let m=calMonth+1,y=calYear; if(m>11){m=0;y++;} setCalMonth(m);setCalYear(y); }}
                                className={`p-2 rounded-lg ${tSub} hover:text-purple-500`}><i className="fas fa-chevron-right"/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 mb-1">
                            {['日','一','二','三','四','五','六'].map(d=>(<div key={d} className={`text-center text-[9px] font-black ${tSub}`}>{d}</div>))}
                        </div>
                        {(() => {
                            const firstDay=new Date(calYear,calMonth,1).getDay();
                            const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
                            const todayStr=today();
                            const monthStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
                            const dayMap={};
                            list.filter(c=>c.publish_date&&c.publish_date.startsWith(monthStr)).forEach(c=>{
                                const d=c.publish_date.slice(8,10); if(!dayMap[d]) dayMap[d]=[]; dayMap[d].push(c);
                            });
                            const cells=[];
                            for(let i=0;i<firstDay;i++) cells.push(<div key={'b'+i}/>);
                            for(let d=1;d<=daysInMonth;d++){
                                const dStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                const items=dayMap[String(d).padStart(2,'0')]||[];
                                const isToday=dStr===todayStr;
                                cells.push(
                                    <div key={d} className={`min-h-[52px] rounded-xl p-1 border transition-all ${
                                        isToday?(isDarkMode?'border-purple-500 bg-purple-500/10':'border-purple-400 bg-purple-50'):
                                        items.length>0?(isDarkMode?'border-purple-800 bg-purple-900/20':'border-purple-200 bg-purple-50/50'):
                                        (isDarkMode?'border-slate-800':'border-slate-100')
                                    }`}>
                                        <p className={`text-[9px] font-black mb-0.5 ${isToday?'text-purple-500':tSub}`}>{d}</p>
                                        {items.slice(0,2).map((c,i)=>(
                                            <div key={i} className="text-[8px] font-bold truncate px-1 py-0.5 rounded mb-0.5"
                                                style={{background:(CONTENT_PLATFORM[c.platform]?.color||'#6366f1')+'20',color:CONTENT_PLATFORM[c.platform]?.color||'#6366f1'}}>
                                                {c.title}
                                            </div>
                                        ))}
                                        {items.length>2&&<p className="text-[8px] text-purple-400 font-black">+{items.length-2}</p>}
                                    </div>
                                );
                            }
                            return <div className="grid grid-cols-7 gap-1">{cells}</div>;
                        })()}
                        <div className="mt-3 flex flex-wrap gap-2">
                            {Object.entries(CONTENT_PLATFORM).map(([k,v])=>(
                                <span key={k} className="text-[9px] font-bold px-2 py-0.5 rounded-full" style={{background:v.color+'20',color:v.color}}>{v.label}</span>
                            ))}
                        </div>
                    </div>
                )}

                {/* 内容列表 */}
                {viewMode==='list' && (
                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                    {filtered.length === 0 && (
                        <div className={`text-center py-16 ${tSub}`}>
                            <i className="fas fa-film text-4xl opacity-20 mb-3 block"/>
                            <p className="text-sm">还没有内容，点击「新建内容」开始规划</p>
                        </div>
                    )}
                    {filtered.map(c => {
                        const st = CONTENT_STATUS[c.status];
                        const pl = CONTENT_PLATFORM[c.platform] || { label: c.platform, color: '#94a3b8' };
                        return (
                            <div key={c.id} className={`rounded-xl border p-3 group ${sub}`}>
                                <div className="flex items-start justify-between gap-2">
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-2 mb-1 flex-wrap">
                                            <span className="text-[10px] font-black px-2 py-0.5 rounded-full" style={{background:st.bg, color:st.color}}>{st.label}</span>
                                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:pl.color+'dd'}}>{pl.label}</span>
                                            {c.publish_date && <span className={`text-[9px] ${tSub}`}>{c.publish_date}</span>}
                                        </div>
                                        <p className={`font-bold text-sm ${tMain} leading-snug`}>{c.title}</p>
                                        {c.status === 'published' && (c.views > 0 || c.likes > 0) && (
                                            <div className="flex gap-3 mt-1.5">
                                                {c.views > 0 && <span className={`text-[10px] ${tSub}`}><i className="fas fa-eye mr-1"/>{c.views.toLocaleString()}</span>}
                                                {c.likes > 0 && <span className={`text-[10px] ${tSub}`}><i className="fas fa-heart mr-1 text-red-400"/>{c.likes.toLocaleString()}</span>}
                                                {c.fans_gain > 0 && <span className="text-[10px] text-emerald-500 font-bold">+{c.fans_gain} 粉</span>}
                                            </div>
                                        )}
                                        {c.note && <p className={`text-[10px] mt-1 leading-relaxed ${tSub} line-clamp-2`}>{c.note}</p>}
                                    </div>
                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                                        {c.link && <a href={c.link} target="_blank" rel="noopener noreferrer" className="p-1.5 rounded-lg text-blue-500 hover:bg-blue-50 text-xs"><i className="fas fa-external-link-alt"/></a>}
                                        <button onClick={()=>startEdit(c)} className={`p-1.5 rounded-lg text-xs ${tSub} hover:text-slate-700`}><i className="fas fa-pencil-alt"/></button>
                                        <button onClick={()=>deleteItem(c.id)} className="p-1.5 rounded-lg text-xs text-slate-400 hover:text-red-500"><i className="fas fa-trash-alt"/></button>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
                )}
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   P0-2  财务现金流记录 Money Tracker
───────────────────────────────────────── */
const MoneyTrackerModal = ({ isOpen, onClose, records, onSave, isDarkMode }) => {
    const [list, setList] = useState(records);
    const [editing, setEditing] = useState(null);
    const [form, setForm] = useState({ type:'income', category:'商单', amount:0, note:'', date:today() });
    const [viewMonth, setViewMonth] = useState(() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; });

    useEffect(() => { if (isOpen) setList(records); }, [isOpen, records]);

    const INCOME_CATS = ['商单', '知识付费', '项目合作', '打赏', '其他收入'];
    const EXPENSE_CATS = ['工具订阅', '设备', '学习课程', '运营成本', '其他支出'];

    const startNew = (type='income') => {
        setForm({ type, category: type==='income'?'商单':'工具订阅', amount:0, note:'', date:today() });
        setEditing('new');
    };
    const saveItem = () => {
        if (!form.amount) return;
        const nl = editing==='new'
            ? [...list, {...form, id:'m'+Date.now(), amount:Number(form.amount)}]
            : list.map(r => r.id===editing ? {...form,id:r.id,amount:Number(form.amount)} : r);
        setList(nl); setEditing(null); onSave(nl);
    };
    const deleteItem = (id) => { const nl=list.filter(r=>r.id!==id); setList(nl); onSave(nl); };

    if (!isOpen) return null;

    const card  = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub   = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200';
    const inp   = isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-500' : 'bg-white border-slate-200 text-slate-900';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    const monthRecords = list.filter(r => r.date && r.date.startsWith(viewMonth));
    const income  = monthRecords.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
    const expense = monthRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
    const net = income - expense;

    // 月份列表：动态生成往前12个月+往后6个月，永远不会"找不到月份"
    const dynMonths = [];
    for (let i = -6; i <= 12; i++) {
        const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
        dynMonths.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }
    const months = [...new Set([...dynMonths, ...list.map(r=>r.date?.slice(0,7)).filter(Boolean)])].sort().reverse();

    // 收入分类汇总
    const incomeByCat = {};
    monthRecords.filter(r=>r.type==='income').forEach(r => { incomeByCat[r.category] = (incomeByCat[r.category]||0)+r.amount; });

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>
                {/* Header */}
                <div className={`p-4 border-b flex justify-between items-center shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-emerald-100 flex items-center justify-center">
                            <i className="fas fa-coins text-emerald-600 text-sm"/>
                        </div>
                        <div>
                            <h3 className={`text-base font-black ${tMain}`}>现金流 Money Tracker</h3>
                            <p className={`text-[10px] ${tSub}`}>{viewMonth} · 净收入 <span className={net>=0?'text-emerald-500 font-bold':'text-red-500 font-bold'}>¥{net.toLocaleString()}</span></p>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={()=>startNew('income')} className="text-xs font-black px-2.5 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 flex items-center gap-1">
                            <i className="fas fa-plus"/> 收入
                        </button>
                        <button onClick={()=>startNew('expense')} className="text-xs font-black px-2.5 py-2 rounded-xl bg-red-600 text-white hover:bg-red-500 flex items-center gap-1">
                            <i className="fas fa-minus"/> 支出
                        </button>
                        <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                    </div>
                </div>

                {/* 月份切换 + 本月汇总 */}
                <div className={`px-4 py-3 border-b shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <div className="flex gap-1 overflow-x-auto mb-3">
                        {months.slice(0,6).map(m => (
                            <button key={m} onClick={()=>setViewMonth(m)}
                                className={`px-3 py-1 rounded-lg text-[10px] font-black whitespace-nowrap transition-all ${viewMonth===m?'bg-emerald-600 text-white':''+tSub+' '+sub}`}>
                                {m}
                            </button>
                        ))}
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                        <div className="text-center p-2 rounded-xl" style={{background:'rgba(16,185,129,0.1)'}}>
                            <p className="text-lg font-black text-emerald-500">¥{income.toLocaleString()}</p>
                            <p className={`text-[9px] ${tSub}`}>收入</p>
                        </div>
                        <div className="text-center p-2 rounded-xl" style={{background:'rgba(239,68,68,0.1)'}}>
                            <p className="text-lg font-black text-red-500">¥{expense.toLocaleString()}</p>
                            <p className={`text-[9px] ${tSub}`}>支出</p>
                        </div>
                        <div className="text-center p-2 rounded-xl" style={{background:`rgba(${net>=0?'16,185,129':'239,68,68'},0.1)`}}>
                            <p className={`text-lg font-black ${net>=0?'text-emerald-500':'text-red-500'}`}>¥{net.toLocaleString()}</p>
                            <p className={`text-[9px] ${tSub}`}>净收</p>
                        </div>
                    </div>
                    {Object.keys(incomeByCat).length > 0 && (
                        <div className="flex gap-2 mt-2 flex-wrap">
                            {Object.entries(incomeByCat).map(([cat,amt]) => (
                                <span key={cat} className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">{cat} ¥{amt}</span>
                            ))}
                        </div>
                    )}
                </div>

                {/* 编辑表单 */}
                {editing && (
                    <div className={`p-4 border-b shrink-0 ${isDarkMode?'border-slate-800 bg-slate-800/40':'border-slate-100 bg-slate-50'}`}>
                        <div className="grid grid-cols-2 gap-2 mb-2">
                            <select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value,category:e.target.value==='income'?'商单':'工具订阅'}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                <option value="income">💰 收入</option>
                                <option value="expense">💸 支出</option>
                            </select>
                            <select value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))} className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                {(form.type==='income'?INCOME_CATS:EXPENSE_CATS).map(c=><option key={c} value={c}>{c}</option>)}
                            </select>
                            <input type="number" placeholder="金额 ¥" value={form.amount||''} onChange={e=>setForm(p=>({...p,amount:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none font-bold ${inp}`} autoFocus />
                            <input type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <input type="text" placeholder="备注（哪个甲方/平台...）" value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))}
                                className={`col-span-2 border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl border text-sm font-bold ${isDarkMode?'border-slate-700 text-slate-400':'border-slate-200 text-slate-500'}`}>取消</button>
                            <button onClick={saveItem} className={`flex-1 py-2 rounded-xl text-white font-bold text-sm ${form.type==='income'?'bg-emerald-600 hover:bg-emerald-500':'bg-red-600 hover:bg-red-500'}`}>保存</button>
                        </div>
                    </div>
                )}

                {/* 记录列表 */}
                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                    {monthRecords.length === 0 && (
                        <div className={`text-center py-16 ${tSub}`}>
                            <i className="fas fa-coins text-4xl opacity-20 mb-3 block"/>
                            <p className="text-sm">本月暂无记录，点击「收入/支出」按钮添加</p>
                        </div>
                    )}
                    {[...monthRecords].reverse().map(r => (
                        <div key={r.id} className={`rounded-xl border p-3 flex items-center gap-3 group ${sub}`}>
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${r.type==='income'?'bg-emerald-100':'bg-red-100'}`}>
                                <i className={`fas ${r.type==='income'?'fa-arrow-up text-emerald-600':'fa-arrow-down text-red-600'} text-xs`}/>
                            </div>
                            <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-2">
                                    <span className={`text-sm font-black ${r.type==='income'?'text-emerald-500':'text-red-500'}`}>{r.type==='income'?'+':'-'}¥{Number(r.amount).toLocaleString()}</span>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-bold ${isDarkMode?'bg-slate-700 text-slate-300':'bg-slate-100 text-slate-500'}`}>{r.category}</span>
                                </div>
                                {r.note && <p className={`text-[10px] ${tSub} truncate`}>{r.note}</p>}
                                <p className={`text-[9px] ${tSub}`}>{r.date}</p>
                            </div>
                            <button onClick={()=>deleteItem(r.id)} className="p-1.5 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                                <i className="fas fa-trash-alt text-xs"/>
                            </button>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   P0-3  保研目标院校管理 Target Schools
───────────────────────────────────────── */
const SCHOOL_STATUS = {
    target:    { label: '目标院校', color: '#3b82f6' },
    contacted: { label: '已联系导师', color: '#8b5cf6' },
    applied:   { label: '已投递', color: '#f59e0b' },
    interview: { label: '拿到面试', color: '#10b981' },
    admitted:  { label: '已录取', color: '#eab308' },
    rejected:  { label: '已拒绝', color: '#ef4444' },
};

const TargetSchoolsModal = ({ isOpen, onClose, schools, onSave, isDarkMode }) => {
    const [list, setList] = useState(schools);
    const [editing, setEditing] = useState(null);
    const [compareMode, setCompareMode] = useState(false);
    const [compareIds, setCompareIds] = useState([]);
    const [form, setForm] = useState({ name:'', major:'数字经济', rank:'211', status:'target', deadline:'', tutor_name:'', tutor_status:'未联系', note:'', link:'' });

    useEffect(() => { if (isOpen) setList(schools); }, [isOpen, schools]);

    const startNew = () => {
        setForm({ name:'', major:'数字经济', rank:'211', status:'target', deadline:'', tutor_name:'', tutor_status:'未联系', note:'', link:'' });
        setEditing('new');
    };
    const startEdit = (s) => { setForm({...s}); setEditing(s.id); };
    const saveItem = () => {
        if (!form.name.trim()) return;
        const nl = editing==='new'
            ? [...list, {...form, id:'s'+Date.now()}]
            : list.map(s => s.id===editing ? {...form,id:s.id} : s);
        setList(nl); setEditing(null); onSave(nl);
    };
    const deleteItem = (id) => { const nl=list.filter(s=>s.id!==id); setList(nl); onSave(nl); };

    if (!isOpen) return null;
    const card  = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub   = isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200';
    const inp   = isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-500' : 'bg-white border-slate-200 text-slate-900';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    const now = new Date();

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>

                    <div className="flex items-center gap-3">

                            <i className="fas fa-university text-blue-600 text-sm"/>

                        <div>
                            <h3 className={`text-base font-black ${tMain}`}>目标院校管理</h3>
                            <p className={`text-[10px] ${tSub}`}>{list.length} 所院校 · {list.filter(s=>s.status==='contacted'||s.status==='applied'||s.status==='interview'||s.status==='admitted').length} 所已推进</p>

                    </div>
                    <div className="flex gap-2">
                        <button onClick={()=>{setCompareMode(v=>!v);setCompareIds([]);}} className={`text-xs font-black px-3 py-2 rounded-xl flex items-center gap-1.5 transition-all ${compareMode?'bg-amber-500 text-white':''+tSub+' border '+(isDarkMode?'border-slate-700':'border-slate-200')}`}>

                        <button onClick={startNew} className="text-xs font-black px-3 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-500 flex items-center gap-1.5">
                            <i className="fas fa-plus"/> 添加
                        </button>
                        <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                    </div>
                </div>

                {editing && (
                    <div className={`p-4 border-b shrink-0 ${isDarkMode?'border-slate-800 bg-slate-800/40':'border-slate-100 bg-blue-50/40'}`}>
                        <div className="grid grid-cols-2 gap-2 mb-2">
                            <input type="text" placeholder="院校名称 *" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}

                            <input type="text" placeholder="目标专业" value={form.major} onChange={e=>setForm(p=>({...p,major:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <select value={form.rank} onChange={e=>setForm(p=>({...p,rank:e.target.value}))} className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                <option value="985">985</option>
                                <option value="211">211</option>
                                <option value="双非">双非重点</option>
                            </select>
                            <select value={form.status} onChange={e=>setForm(p=>({...p,status:e.target.value}))} className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                {Object.entries(SCHOOL_STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                            </select>
                            <input type="text" placeholder="目标导师姓名" value={form.tutor_name} onChange={e=>setForm(p=>({...p,tutor_name:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <select value={form.tutor_status} onChange={e=>setForm(p=>({...p,tutor_status:e.target.value}))} className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`}>
                                {['未联系','已发邮件','已回复','约好面谈','已确认'].map(s=><option key={s} value={s}>{s}</option>)}
                            </select>
                            <input type="date" placeholder="申请截止日期" value={form.deadline} onChange={e=>setForm(p=>({...p,deadline:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <input type="text" placeholder="学院官网/导师主页链接" value={form.link} onChange={e=>setForm(p=>({...p,link:e.target.value}))}
                                className={`border rounded-xl px-3 py-2 text-sm outline-none ${inp}`} />
                            <textarea rows={2} placeholder="备注（院校特点、联系记录...）" value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))}
                                className={`col-span-2 border rounded-xl px-3 py-2 text-sm outline-none resize-none ${inp}`} />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setEditing(null)} className={`flex-1 py-2 rounded-xl border text-sm font-bold ${isDarkMode?'border-slate-700 text-slate-400':'border-slate-200 text-slate-500'}`}>取消</button>
                            <button onClick={saveItem} className="flex-1 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-500">保存院校</button>
                        </div>
                    </div>
                )}

                {/* 🏛️ 院校对比模式 */}
                {compareMode && (
                    <div className="flex-1 overflow-y-auto p-4">
                        <p className="text-xs font-black text-amber-500 uppercase tracking-widest mb-3">🏛️ 面对面对比 · 选择2-3所院校</p>
                        <div className="flex flex-wrap gap-2 mb-4">
                            {list.map(s=>(
                                <button key={s.id}
                                    onClick={()=>setCompareIds(prev=>prev.includes(s.id)?prev.filter(x=>x!==s.id):[...prev,s.id].slice(-3))}
                                    className={`text-xs font-black px-3 py-1.5 rounded-xl border transition-all ${compareIds.includes(s.id)?'bg-amber-500 text-white border-amber-500':''+tSub+' '+sub}`}>
                                    {s.name}
                                </button>
                            ))}
                        </div>
                        {compareIds.length >= 2 ? (
                            <div className={`grid gap-3 ${compareIds.length===3?'grid-cols-3':'grid-cols-2'}`}>
                                {compareIds.map(id=>{
                                    const s=list.find(x=>x.id===id); if(!s) return null;
                                    const st=SCHOOL_STATUS[s.status]||SCHOOL_STATUS.target;
                                    const now2=new Date();
                                    const days=s.deadline?Math.ceil((new Date(s.deadline)-now2)/(1000*60*60*24)):null;
                                    return (
                                        <div key={id} className={`rounded-2xl border p-3 ${sub}`} style={{borderColor:st.color+'40'}}>
                                            <div className="mb-2 pb-2 border-b" style={{borderColor:st.color+'20'}}>
                                                <span className={`text-[9px] font-black px-1.5 py-0.5 rounded ${s.rank==='985'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700'}`}>{s.rank}</span>
                                                <p className="text-sm font-black mt-1" style={{color:st.color}}>{s.name}</p>
                                                <span className="text-[9px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:st.color+'cc'}}>{st.label}</span>
                                            </div>
                                            {[{k:'专业',v:s.major},{k:'导师',v:s.tutor_name||'-'},{k:'套磁',v:s.tutor_status||'-'}].map(row=>(
                                                <div key={row.k} className="flex justify-between items-start mb-1.5">
                                                    <span className={`text-[8px] font-black uppercase ${tSub}`}>{row.k}</span>
                                                    <span className="text-[9px] font-bold text-right max-w-[65%]">{row.v}</span>
                                                </div>
                                            ))}
                                            {days!==null && (
                                                <div className={`mt-2 text-center text-[9px] font-black px-2 py-1 rounded-lg ${days<30?'bg-red-100 text-red-600':days<60?'bg-amber-100 text-amber-600':'bg-emerald-100 text-emerald-600'}`}>
                                                    {days>0?`截止${days}天`:'已过期'}
                                                </div>
                                            )}
                                            {s.note && <p className={`mt-2 text-[8px] leading-relaxed ${tSub} line-clamp-3`}>{s.note}</p>}
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <p className={`text-center py-8 text-sm ${tSub}`}>请选择2到3所院校进行对比</p>
                        )}
                    </div>
                )}

                {!compareMode && (
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    {list.length === 0 && (
                        <div className={`text-center py-16 ${tSub}`}>
                            <i className="fas fa-university text-4xl opacity-20 mb-3 block"/>
                            <p className="text-sm">还没有目标院校，点击「添加院校」开始规划</p>
                        </div>
                    )}
                    {list.map(s => {
                        const st = SCHOOL_STATUS[s.status] || SCHOOL_STATUS.target;
                        const daysToDeadline = s.deadline ? Math.ceil((new Date(s.deadline)-now)/(1000*60*60*24)) : null;
                        return (
                            <div key={s.id} className={`rounded-xl border p-4 group ${sub}`}>
                                <div className="flex items-start justify-between gap-2 mb-2">
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-2 flex-wrap mb-1">
                                            <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-md ${s.rank==='985'?'bg-amber-100 text-amber-700':s.rank==='211'?'bg-blue-100 text-blue-700':'bg-slate-100 text-slate-500'}`}>{s.rank}</span>
                                            <span className="text-sm font-black" style={{color:st.color}}>{s.name}</span>
                                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:st.color+'cc'}}>{st.label}</span>
                                        </div>
                                        <p className={`text-[10px] ${tSub}`}>{s.major} {s.tutor_name && `· 导师: ${s.tutor_name} (${s.tutor_status})`}</p>
                                        {s.note && <p className={`text-[10px] mt-1 leading-relaxed ${tSub} line-clamp-2`}>{s.note}</p>}
                                    </div>
                                    <div className="flex items-center gap-1 shrink-0">
                                        {daysToDeadline !== null && (
                                            <span className={`text-[10px] font-black px-2 py-1 rounded-lg ${daysToDeadline<30?'bg-red-100 text-red-600':daysToDeadline<60?'bg-amber-100 text-amber-600':'bg-slate-100 text-slate-500'}`}>
                                                {daysToDeadline>0?`${daysToDeadline}天后截止`:'已过期'}
                                            </span>
                                        )}
                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            {s.link && <a href={s.link} target="_blank" rel="noopener noreferrer" className="p-1.5 rounded-lg text-blue-500 text-xs hover:bg-blue-50"><i className="fas fa-external-link-alt"/></a>}
                                            <button onClick={()=>startEdit(s)} className={`p-1.5 rounded-lg text-xs ${tSub}`}><i className="fas fa-pencil-alt"/></button>
                                            <button onClick={()=>deleteItem(s.id)} className="p-1.5 rounded-lg text-xs text-slate-400 hover:text-red-500"><i className="fas fa-trash-alt"/></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
                )}
            </div>
        </div>
    );
};

/* ─────────────────────────────────────────
   P1-1  周计划 Weekly War Room
───────────────────────────────────────── */
const getWeekKey = (d=new Date()) => {
    const tmp = new Date(d); tmp.setHours(0,0,0,0);
    tmp.setDate(tmp.getDate() - ((tmp.getDay()+6)%7)); // 周一
    return dateKey(tmp);
};
const getWeekLabel = (wk) => {
    const s = parseDateKey(wk) || new Date();
    const e = new Date(s); e.setDate(e.getDate()+6);
    return `${s.getMonth()+1}/${s.getDate()} – ${e.getMonth()+1}/${e.getDate()}`;
};

const WeeklyWarRoomModal = ({ isOpen, onClose, weeks, onSave, history, isDarkMode }) => {
    const thisWeek = getWeekKey();
    const [selWeek, setSelWeek] = useState(thisWeek);
    const [editMode, setEditMode] = useState(false);
    const [form, setForm] = useState({ goal1:'', goal2:'', goal3:'', review:'', rating:3 });

    useEffect(() => {
        if (isOpen) {
            const w = weeks[thisWeek] || { goal1:'', goal2:'', goal3:'', review:'', rating:3 };
            setForm(w);
        }
    }, [isOpen, thisWeek, weeks]);

    useEffect(() => {
        const w = weeks[selWeek] || { goal1:'', goal2:'', goal3:'', review:'', rating:3 };
        setForm(w);
        setEditMode(false);
    }, [selWeek]);

    const [goalChecks, setGoalChecks] = React.useState(() => LS.get('a8_goal_checks', {}));
    const toggleGoalCheck = (weekKey, goalKey) => {
        setGoalChecks(prev => {
            const wk = prev[weekKey] || {};
            const updated = { ...prev, [weekKey]: { ...wk, [goalKey]: !wk[goalKey] } };
            LS.set('a8_goal_checks', updated);
            return updated;
        });
    };

    if (!isOpen) return null;

    const getWeekStats = (wk) => {
        const start = new Date(wk);
        const days = Array.from({length:7}, (_,i) => {
            const d = new Date(start); d.setDate(d.getDate()+i);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        });
        const dayStats = days.map(dk => {
            const h = (history||{})[dk] || {};
            return PLAN_DATA.filter(t=>h[t.id]).length;
        });
        const checkedDays = dayStats.filter(x=>x>0).length;
        const avgPct = Math.round(dayStats.reduce((s,x)=>s+x,0) / (7 * PLAN_DATA.length) * 100);
        return { checkedDays, avgPct };
    };

    const saveWeek = () => {
        onSave({ ...weeks, [selWeek]: form });
        setEditMode(false);
    };

    const isThisWeek = selWeek === thisWeek;
    const card  = isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200';
    const sub   = isDarkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-slate-50 border-slate-200';
    const inp   = isDarkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-slate-500' : 'bg-white border-slate-200 text-slate-900';
    const tMain = isDarkMode ? 'text-white' : 'text-slate-900';
    const tSub  = isDarkMode ? 'text-slate-400' : 'text-slate-500';

    // 生成动态周列表：往前8周 + 往后8周（覆盖未来两月，长期可用）
    const recentWeeks = [];
    for (let i = -8; i <= 8; i++) {
        const d = new Date(); d.setDate(d.getDate() + i * 7);
        recentWeeks.push(getWeekKey(d));
    }
    // 去重并排序（最新在前）
    const uniqueWeeks = [...new Set(recentWeeks)].sort().reverse();

    const STARS = ['😭','😐','🙂','💪','🔥'];

    return (
        <div className="fixed inset-0 z-[450] flex items-stretch justify-center" style={{background:'rgba(0,0,0,0.7)'}}>
            <div className={`w-full max-w-2xl flex flex-col shadow-2xl border ${card}`} onClick={e=>e.stopPropagation()}>
                <div className={`p-4 border-b flex justify-between items-center shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-indigo-100 flex items-center justify-center">
                            <i className="fas fa-chess text-indigo-600 text-sm"/>
                        </div>
                        <div>
                            <h3 className={`text-base font-black ${tMain}`}>周作战室 Weekly War Room</h3>
                            <p className={`text-[10px] ${tSub}`}>第 {getWeekLabel(selWeek)} 周</p>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        {!editMode && <button onClick={()=>setEditMode(true)} className="text-xs font-black px-3 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-500 flex items-center gap-1"><i className="fas fa-pen"/> {isThisWeek?'编辑本周':'查看编辑'}</button>}
                        <button onClick={onClose} className={`p-2 rounded-lg ${tSub} hover:text-red-500`}><i className="fas fa-times"/></button>
                    </div>
                </div>

                {/* 周选择 — 往前8周+往后8周，持续可用 */}
                <div className={`px-4 py-2 border-b flex gap-1.5 overflow-x-auto shrink-0 ${isDarkMode?'border-slate-800':'border-slate-100'}`}>
                    {uniqueWeeks.map(wk => (
                        <button key={wk} onClick={()=>setSelWeek(wk)}
                            className={`px-3 py-1 rounded-lg text-[10px] font-black whitespace-nowrap transition-all ${selWeek===wk?'bg-indigo-600 text-white':tSub+' '+sub}`}>
                            {wk===thisWeek?'📍本周':getWeekLabel(wk)}
                            {weeks[wk] ? <span className="ml-1">{STARS[(weeks[wk].rating||2)]}</span> : (new Date(wk) > new Date(thisWeek) ? <span className="ml-1 opacity-40">未来</span> : '')}
                        </button>
                    ))}
                </div>

                <div className="flex-1 overflow-y-auto p-4">
                    {editMode ? (
                        <div className="space-y-4">
                            <div>
                                <p className="text-xs font-black text-indigo-500 uppercase tracking-widest mb-2">🎯 本周3大目标</p>
                                {['goal1','goal2','goal3'].map((k,i) => (
                                    <input key={k} type="text" placeholder={`目标 ${i+1}（具体、可衡量）`} value={form[k]} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}
                                        className={`w-full border rounded-xl px-3 py-2.5 text-sm outline-none mb-2 ${inp}`} />
                                ))}
                            </div>
                            <div>
                                <p className="text-xs font-black text-emerald-500 uppercase tracking-widest mb-2">📝 周末复盘</p>
                                <textarea rows={4} placeholder="这周做到了什么？哪里没做好？下周怎么做？" value={form.review} onChange={e=>setForm(p=>({...p,review:e.target.value}))}
                                    className={`w-full border rounded-xl px-3 py-2.5 text-sm outline-none resize-none ${inp}`} />
                            </div>
                            <div>
                                <p className="text-xs font-black text-amber-500 uppercase tracking-widest mb-2">本周评价</p>
                                <div className="flex gap-2">
                                    {STARS.map((s,i) => (
                                        <button key={i} onClick={()=>setForm(p=>({...p,rating:i}))}
                                            className={`flex-1 py-2 rounded-xl text-xl transition-all ${form.rating===i?'bg-indigo-100 scale-110':'opacity-40 hover:opacity-70'}`}>{s}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={()=>setEditMode(false)} className={`flex-1 py-2.5 rounded-xl border text-sm font-bold ${isDarkMode?'border-slate-700 text-slate-400':'border-slate-200 text-slate-500'}`}>取消</button>
                                <button onClick={saveWeek} className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-500">保存本周</button>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {(form.goal1||form.goal2||form.goal3) ? (
                                <div>
                                    <p className="text-xs font-black text-indigo-500 uppercase tracking-widest mb-3">🎯 本周目标 · 点击打勾</p>
                                    {['goal1','goal2','goal3'].filter(k=>form[k]).map((k,i) => {
                                        const checked = (goalChecks[selWeek]||{})[k];
                                        return (
                                        <div key={k} onClick={()=>isThisWeek&&toggleGoalCheck(selWeek,k)}
                                            className={`flex items-center gap-3 p-3 rounded-xl border mb-2 transition-all ${isThisWeek?'cursor-pointer':''} ${
                                                checked?(isDarkMode?'border-emerald-500/30 bg-emerald-900/20':'border-emerald-200 bg-emerald-50'):sub
                                            }`}>
                                            <div className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black shrink-0 transition-all ${
                                                checked?'bg-emerald-500 text-white':'bg-indigo-100 text-indigo-600'
                                            }`}>{checked?'✓':i+1}</div>
                                            <p className={`text-sm font-medium flex-1 ${checked?'line-through opacity-50':tMain}`}>{form[k]}</p>
                                            {checked && <span className="text-[9px] text-emerald-500 font-black">✅ 已完成</span>}
                                        </div>
                                        );
                                    })}
                                    {isThisWeek && <p className={`text-[9px] ${tSub} text-center mt-1`}>点击目标可标记完成状态</p>}
                                </div>
                            ) : (
                                <div className={`text-center py-8 ${tSub}`}>
                                    <i className="fas fa-chess text-4xl opacity-20 mb-3 block"/>
                                    <p className="text-sm mb-3">还没有设定本周目标</p>
                                    <button onClick={()=>setEditMode(true)} className="text-xs font-bold text-indigo-500 border border-indigo-200 px-4 py-2 rounded-xl hover:bg-indigo-50">立即设定</button>
                                </div>
                            )}
                            {form.review && (
                                <div>
                                    <p className="text-xs font-black text-emerald-500 uppercase tracking-widest mb-2">📝 周复盘</p>
                                    <div className={`p-4 rounded-xl border ${sub}`}>
                                        <p className={`text-sm leading-relaxed ${tMain}`}>{form.review}</p>
                                        <p className="text-xl mt-2">{STARS[form.rating||2]}</p>
                                    </div>
                                </div>
                            )}
                            {/* 本周vs上周数据对比 */}
                            {(() => {
                                const prevStart = new Date(selWeek);
                                prevStart.setDate(prevStart.getDate()-7);
                                const prevKey = getWeekKey(prevStart);
                                const curr = getWeekStats(selWeek);
                                const prev = getWeekStats(prevKey);
                                const diffDays = curr.checkedDays - prev.checkedDays;
                                const diffPct  = curr.avgPct - prev.avgPct;
                                const goalsDone = ['goal1','goal2','goal3'].filter(k=>form[k]&&(goalChecks[selWeek]||{})[k]).length;
                                const goalsTotal = ['goal1','goal2','goal3'].filter(k=>form[k]).length;
                                return (
                                    <div>
                                        <p className="text-xs font-black text-amber-500 uppercase tracking-widest mb-2">📊 周数据 vs 上周</p>
                                        <div className={`grid grid-cols-2 gap-2 p-3 rounded-xl border ${sub}`}>
                                            {[
                                                {label:'打卡天数', curr:curr.checkedDays+'天', diff:diffDays, unit:'天', good:diffDays>=0},
                                                {label:'均完成率', curr:curr.avgPct+'%',    diff:diffPct,  unit:'%', good:diffPct>=0},
                                                {label:'目标达成', curr:`${goalsDone}/${goalsTotal}`, diff:null, unit:'', good:true},
                                                {label:'周评分',   curr:STARS[form.rating||2]||'-', diff:null, unit:'', good:true},
                                            ].map(item=>(
                                                <div key={item.label} className="text-center py-1">
                                                    <p className="text-base font-black">{item.curr}</p>
                                                    {item.diff!==null && (
                                                        <p className={`text-[9px] font-bold ${item.good?'text-emerald-500':'text-red-400'}`}>
                                                            {item.diff>=0?'+':''}{item.diff}{item.unit} vs上周
                                                        </p>
                                                    )}
                                                    <p className={`text-[8px] ${tSub}`}>{item.label}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
};
