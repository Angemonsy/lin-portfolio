    const calcStreak = (hist) => {
        let c = 0, d = new Date();
        while (true) {
            const k = dateKey(d);
            if (hist[k] && Object.values(hist[k]).some(Boolean)) { c++; d.setDate(d.getDate()-1); } else break;
        }
        setStreak(c);
    };

    const calcXP = (hist) => {
        let xp = 0;
        Object.values(hist).forEach(day => {
            Object.entries(day).forEach(([tid, done]) => {
                if (done) { const t = PLAN_DATA.find(p => p.id === tid); xp += t ? t.xp : 1; }
            });
        });
        setTotalXP(xp);
    };

    /* ── Task toggle ── */
    const toggleTask = useCallback((taskId) => {
        const k = today();
        const currentDay = history[k] || {};
        const val = !currentDay[taskId];
        const newToday = { ...currentDay, [taskId]: val };
        const newHist = { ...history, [k]: newToday };
        setCompletedToday(newToday);
        setHistory(newHist);
        LS.set('a8_last_date', k);
        LS.set('a8_today', newToday);
        LS.set('a8_history', newHist);
        calcStreak(newHist);
        calcXP(newHist);
        if (val) {
            setShockTask(taskId);
            setLastActivatedTask(taskId);
            setTimeout(() => { setIsAbsorbing(true); setTimeout(() => setIsAbsorbing(false), 500); }, 400);

        if (!files.length) return;
        const readers = files.map(file => new Promise(res => { const r = new FileReader(); r.onload = (e) => res(e.target.result); r.readAsDataURL(file); }));

            if (side === 'left') { setLeftImages(newImages); await saveToDB('left_images', newImages); }

        const getAllData = () => ({ history, reviews, battleLogs, kpi, customTasks, targetTitle, targetDate, projects, contents, moneyRecords, schools, weeks, bodyLogs, contacts, timelineNodes, countdowns, pomodoroLog, taskOrder, theme });

        if (d.contacts) { setContacts(d.contacts); LS.set('a8_contacts', d.contacts); }

                        .filter(([key]) => key !== 'review')

                        key, label: line.label.replace('线',''), color: line.color,
                        pct: lineStats[key] || 0

                    const W = 180, H = 180, cx = 90, cy = 90, R = 68;
                    const n = radarLines.length;

                        const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
                        const r = R * l.pct / 100;
                        return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), lx: cx + (R+18) * Math.cos(angle), ly: cy + (R+18) * Math.sin(angle) };

                    const gridLevels = [0.25, 0.5, 0.75, 1];
                    const gridPolygons = gridLevels.map(frac => {
                        return Array.from({length:n}, (_,i) => {

                            return `${cx + R*frac*Math.cos(angle)},${cy + R*frac*Math.sin(angle)}`;
                        }).join(' ');

                                        <span className={`text-[8px] ${textSub}`}>高</span>
                                    </div>
                                </div>
                                {/* 雷达图 */}
                                <div className="shrink-0">
                                    <p className={`text-[9px] font-black uppercase tracking-widest mb-2 text-center ${textSub}`}>三维能力图</p>
                                    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
                                        {/* 网格 */}
                                        {gridPolygons.map((pts2, gi) => (
                                            <polygon key={gi} points={pts2} fill="none"
                                                stroke={isDarkMode?'#334155':'#e2e8f0'} strokeWidth="1"/>
                                        ))}
                                        {/* 轴线 */}
                                        {Array.from({length:n},(_,i)=>{
                                            const angle=(Math.PI*2*i/n)-Math.PI/2;
                                            return <line key={i} x1={cx} y1={cy}
                                                x2={cx+R*Math.cos(angle)} y2={cy+R*Math.sin(angle)}
                                                stroke={isDarkMode?'#334155':'#e2e8f0'} strokeWidth="1"/>;
                                        })}
                                        {/* 数据多边形 */}
                                        <polygon points={dataPolygon} fill="#6366f140" stroke="#6366f1" strokeWidth="2"/>

                                            <circle key={i} cx={p.x} cy={p.y} r="3"
                                                fill={radarLines[i].color} stroke="#fff" strokeWidth="1"/>
                                        ))}
                                        {/* 标签 */}
                                        {pts.map((p,i)=>(
                                            <text key={i} x={p.lx} y={p.ly}

                                        <text x={cx} y={cy} textAnchor="middle" dominantBaseline="middle"
                                            fontSize="11" fontWeight="900" fill={isDarkMode?'#fff':'#0f172a'}>
                                            {Math.round(radarLines.reduce((s,l)=>s+l.pct,0)/n)}%
                                        </text>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                                        <p className="opacity-90 leading-relaxed break-words">{log.content}</p>

                        <div className="flex gap-2">
                            <input type="text" value={logInput} onChange={e => setLogInput(e.target.value)}

    const [message, setMessage] = useState('');
    const [error, setError] = useState('');
    const [busy, setBusy] = useState(false);

    const login = async () => {
        setBusy(true); setError(''); setMessage('');
        try {
            const res = await CloudAPI.login(loginId, password);
            localStorage.setItem(AUTH_TOKEN_KEY, res.token);
            const snapshot = await CloudAPI.loadSnapshot();
            onAuthenticated(res.user, snapshot.data || {});
        } catch (err) {
            setError(err.message);
        } finally {
            setBusy(false);
        }
    };

    return (
        <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center px-5">
            <div className="w-full max-w-sm">
                <div className="mb-8">
                    <p className="text-[10px] font-black uppercase tracking-widest text-emerald-400 mb-3">Private Command Center</p>
                    <h1 className="text-4xl font-black italic tracking-tighter bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Alpha Rebirth</h1>
                    <p className="text-sm text-slate-400 mt-3 leading-6">输入私人 ID 和口令后进入打卡系统。数据会保存到后端，同一账号可在手机和电脑同步。</p>
                </div>
                <form className="rounded-2xl border border-slate-800 bg-slate-900/80 p-5 shadow-2xl" onSubmit={e => { e.preventDefault(); login(); }}>
                    <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">ID</label>
                    <input value={loginId} onChange={e=>setLoginId(e.target.value)} inputMode="numeric" autoComplete="username" placeholder="输入私人 ID" className="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-3 text-sm outline-none focus:border-blue-500 mb-3" />
                    <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">口令</label>
                    <input value={password} onChange={e=>setPassword(e.target.value)} type="password" autoComplete="current-password" placeholder="输入私人口令" className="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-3 text-sm outline-none focus:border-emerald-500 mb-3" />
                    {message && <p className="text-xs text-emerald-400 mb-3">{message}</p>}
                    {error && <p className="text-xs text-red-400 mb-3">{error}</p>}
                    <button disabled={busy} type="submit" className="w-full rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 py-3 text-sm font-black transition-all">
                        {busy ? '校验中...' : '进入系统'}
                    </button>
                </form>
            </div>
        </div>
    );
};

const SecureApp = () => {
    const [booting, setBooting] = useState(true);
    const [user, setUser] = useState(null);
    const [snapshot, setSnapshot] = useState(null);

    useEffect(() => {
        const token = localStorage.getItem(AUTH_TOKEN_KEY);
        if (!token) { setBooting(false); return; }
        Promise.all([CloudAPI.me(), CloudAPI.loadSnapshot()])
            .then(([me, snap]) => {
                setUser(me.user);
                setSnapshot(snap.data || {});
            })
            .catch(() => {
                localStorage.removeItem(AUTH_TOKEN_KEY);
                setUser(null);
                setSnapshot(null);
            })
            .finally(() => setBooting(false));
    }, []);

    const handleAuthenticated = (nextUser, nextSnapshot) => {
        setUser(nextUser);
        setSnapshot(nextSnapshot || {});
    };

    const handleLogout = async () => {
        try { await CloudAPI.logout(); } catch {}
        localStorage.removeItem(AUTH_TOKEN_KEY);
        setUser(null);
        setSnapshot(null);
    };

    if (booting) {
        return (
            <div className="min-h-screen bg-slate-950 text-slate-300 flex items-center justify-center">
                <div className="text-center">
                    <i className="fas fa-circle-notch fa-spin text-blue-400 text-2xl mb-3" />
                    <p className="text-xs font-black uppercase tracking-widest">连接私人数据仓库</p>
                </div>
            </div>
        );
    }

    if (!user) return <AuthScreen onAuthenticated={handleAuthenticated} />;
    return <App key={user.id} initialCloudData={snapshot || {}} cloudUser={user} onCloudSave={CloudAPI.saveSnapshot} onLogout={handleLogout} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SecureApp />);

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
}
</script>
</body>
</html>
